services:
  server:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - server-data:/app/data
      # Keep the APNs .p8 outside the image and repository. Set
      # APNS_KEY_PATH to its in-container /run/secrets/drel/... path.
      - ${APNS_KEY_DIRECTORY:-./secrets}:/run/secrets/drel:ro
    restart: unless-stopped

volumes:
  server-data:
