# Drel's optional self-hosted APNs relay on the replay host. The Docker
# service binds only to 127.0.0.1:8080; this is its sole public TLS boundary.
server {
    listen 80;
    listen [::]:80;
    server_name push.drel.app;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name push.drel.app;

    ssl_certificate /etc/letsencrypt/live/push.drel.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/push.drel.app/privkey.pem;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
