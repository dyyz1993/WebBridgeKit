# Temporary HTTP-only virtual host for issuing the push.drel.app certificate.
# Replace this file with push.drel.app.conf only after certbot succeeds.
server {
    listen 80;
    listen [::]:80;
    server_name push.drel.app;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
