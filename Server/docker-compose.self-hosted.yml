services:
  server:
    build: .
    env_file:
      - .env
    expose:
      - "8080"
    volumes:
      - server-data:/app/data
      # The APNs provider key stays on the host and is never copied into the
      # image. APNS_KEY_PATH must use the matching /run/secrets/drel path.
      - ${APNS_KEY_DIRECTORY:-./secrets}:/run/secrets/drel:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      server:
        condition: service_healthy
    # Caddy needs only TLS metadata. Never inject APNs, admin, or gateway
    # secrets into the public proxy container.
    environment:
      DREL_SELF_HOSTED_DOMAIN: ${DREL_SELF_HOSTED_DOMAIN}
      DREL_SELF_HOSTED_ACME_EMAIL: ${DREL_SELF_HOSTED_ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  server-data:
  caddy-data:
  caddy-config:
