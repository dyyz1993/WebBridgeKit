<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>原生能力演示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #f5f5f7; color: #1d1d1f; padding: 20px; max-width: 500px; margin: 0 auto; }
        h1 { margin: 12px 0 6px; font-size: 28px; }
        .runtime { color: #86868b; font-size: 13px; margin-bottom: 16px; }
        .desc { color: #86868b; font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
        h2 { font-size: 15px; margin-top: 20px; margin-bottom: 4px; }
        button { width: 100%; min-height: 50px; margin-top: 12px; border: 0; border-radius: 14px; background: #4f6af6; color: white; font-size: 16px; font-weight: 600; cursor: pointer; }
        button:active { opacity: 0.8; }
        pre { background: #e8e8ed; border-radius: 10px; padding: 10px; font-size: 12px; margin-top: 8px; white-space: pre-wrap; word-break: break-all; min-height: 36px; color: #3a3a3c; }
    </style>
</head>
<body>
    <h1>原生能力演示</h1>
    <div class="runtime" id="runtime">正在检测运行容器…</div>
    <div class="desc">本页面演示 WebBridgeKit 受保护原生能力的完整授权流程。点击按钮触发对应能力，首次使用会弹出原生授权面板（仅这一次 / 本次使用期间 / 始终允许），硬件能力还会触发 iOS 系统级弹窗。</div>

    <div>
        <h2>蓝牙</h2>
        <pre id="bluetooth-result">尚未调用</pre>
        <button id="bluetooth" onclick="getBluetoothStatus()">查看蓝牙状态</button>
    </div>

    <div>
        <h2>相机</h2>
        <pre id="camera-result">尚未调用</pre>
        <button id="camera" onclick="takePhoto()">使用相机</button>
    </div>

    <div>
        <h2>剪贴板</h2>
        <pre id="clipboard-result">尚未调用</pre>
        <button id="clipboard" onclick="readClipboard()">读取剪贴板</button>
    </div>

    <script>
        setTimeout(function() {
            var rt = document.getElementById('runtime');
            if (window.WebBridgeKit || window.webkit) {
                rt.textContent = 'WebBridgeKit 原生容器 · 原生模块可用';
            } else {
                rt.textContent = '普通浏览器（无原生容器）';
            }
        }, 100);

        async function getBluetoothStatus() {
            const output = document.getElementById('bluetooth-result');
            try {
                const result = await window.BarkBridge.callNative('bluetooth', {
                    action: 'getState'
                });
                output.textContent = JSON.stringify(result, null, 2);
            } catch (e) {
                output.textContent = 'Error: ' + (e.message || e);
            }
        }

        async function takePhoto() {
            const output = document.getElementById('camera-result');
            try {
                const result = await window.BarkBridge.callNative('camera', {
                    action: 'capture'
                });
                output.textContent = JSON.stringify(result, null, 2);
            } catch (e) {
                output.textContent = 'Error: ' + (e.message || e);
            }
        }

        async function readClipboard() {
            const output = document.getElementById('clipboard-result');
            try {
                const result = await window.BarkBridge.callNative('clipboard', {
                    action: 'read'
                });
                output.textContent = JSON.stringify(result, null, 2);
            } catch (e) {
                output.textContent = 'Error: ' + (e.message || e);
            }
        }
    </script>
</body>
</html>
