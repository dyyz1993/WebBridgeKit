<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Block — WebBridgeKit</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: 12px; background: var(--wbk-background-secondary); font-family: var(--wbk-font-family); }
.specimen { max-width: 480px; margin: 0 auto; }
.story { margin-bottom: 16px; }
.story-label { display: block; font: var(--wbk-text-section-title); color: var(--color-text-secondary); margin-bottom: 12px; }
.rail { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 12px; align-items: center; margin-bottom: 0; flex-wrap: wrap; }
.label { font: var(--wbk-text-caption); color: var(--color-text-tertiary); letter-spacing: .5px; min-width: 80px; flex-shrink: 0; }
.divider { border: none; border-top: 1px solid var(--color-separator); margin: 16px 0; }

/* @component-css-start */
.code-block { display: flex; flex-direction: column; width: 100%; border-radius: var(--radius-md); background: var(--color-bg-tertiary); padding: 16px; box-sizing: border-box; }
.code-block-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.code-block-lang { font: var(--wbk-text-monospace-small); color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: .5px; }
.code-block-copy { display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--color-text-tertiary); border: none; background: transparent; padding: 4px; border-radius: var(--radius-sm); transition: color .15s; }
.code-block-copy:hover { color: var(--color-primary); }
.code-block-copy svg { width: 14px; height: 14px; }
.code-block pre { margin: 0; padding: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.code-block code { font: var(--wbk-text-monospace-body); color: var(--color-text); white-space: pre; display: block; }
/* @component-css-end */
</style>
</head>
<body>
<div class="specimen">
  <div class="stage">

    <div class="story">
      <span class="story-label">代码块</span>
      <div class="rail">
        <div class="row">
          <span class="label">带复制按钮</span>
          <div class="code-block" style="max-width:360px;" data-evidence-sample="带复制按钮代码块">
            <div class="code-block-header">
              <span class="code-block-lang">JSON</span>
              <button class="code-block-copy" aria-label="复制">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
              </button>
            </div>
            <pre><code>{
  "token": "abc123",
  "name": "My Server",
  "port": 8080,
  "enabled": true
}</code></pre>
          </div>
        </div>

        <hr class="divider">

        <div class="row">
          <span class="label">纯代码</span>
          <div class="code-block" style="max-width:360px;" data-evidence-sample="纯代码块">
            <pre><code>{
  "token": "abc123",
  "name": "My Server",
  "port": 8080,
  "enabled": true
}</code></pre>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
