<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Switch Card - WebBridgeKit</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin:0; padding:12px; background:var(--wbk-background-secondary); font-family:var(--wbk-font-family); }
.stage { display:flex; flex-direction:column; gap:12px; align-items:stretch; max-width:480px; margin:0 auto; }
.story { display:flex; flex-direction:column; gap:8px; width:100%; }
.story-label { font-size:12px; font-weight:400; color:var(--color-text-tertiary); letter-spacing:0.5px; }

/* @component-css-start */
.switch-card { display:flex; align-items:center; background:var(--color-surface); border-radius:var(--radius-md); padding:0 16px; min-height:48px; }
.switch-card + .switch-card { margin-top:-1px; }
.switch-card__icon { width:24px; height:24px; flex-shrink:0; color:var(--color-primary); display:flex; align-items:center; justify-content:center; margin-right:12px; }
.switch-card__content { flex:1; display:flex; flex-direction:column; gap:2px; min-width:0; }
.switch-card__title { font-size:15px; font-weight:500; color:var(--color-text); line-height:1.3; }
.switch-card__subtitle { font-size:12px; font-weight:400; color:var(--color-text-secondary); line-height:1.3; }
.switch-card__toggle { position:relative; width:51px; height:31px; border-radius:16px; flex-shrink:0; margin-left:12px; }
.switch-card__toggle::after { content:''; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; transition:transform .2s ease; }
.switch-card__toggle--on { background:var(--color-primary); }
.switch-card__toggle--on::after { transform:translateX(20px); }
.switch-card__toggle:not(.switch-card__toggle--on) { background:var(--color-separator); }
/* @component-css-end */
</style>
</head>
<body>
<div class="stage">
  <div class="story">
    <span class="story-label">带副标题</span>
    <div class="switch-card">
      <span class="switch-card__icon"><i data-lucide="bell" width="24" height="24"></i></span>
      <div class="switch-card__content">
        <span class="switch-card__title">推送通知</span>
        <span class="switch-card__subtitle">接收来自服务器的实时消息</span>
      </div>
      <div class="switch-card__toggle switch-card__toggle--on"></div>
    </div>
    <div class="switch-card">
      <span class="switch-card__icon"><i data-lucide="shield" width="24" height="24"></i></span>
      <div class="switch-card__content">
        <span class="switch-card__title">安全验证</span>
        <span class="switch-card__subtitle">启用设备指纹与端到端加密</span>
      </div>
      <div class="switch-card__toggle switch-card__toggle--on"></div>
    </div>
    <div class="switch-card">
      <span class="switch-card__icon"><i data-lucide="moon" width="24" height="24"></i></span>
      <div class="switch-card__content">
        <span class="switch-card__title">深色模式</span>
        <span class="switch-card__subtitle">跟随系统或手动切换主题</span>
      </div>
      <div class="switch-card__toggle"></div>
    </div>
  </div>
  <div class="story">
    <span class="story-label">仅标题</span>
    <div class="switch-card">
      <span class="switch-card__icon"><i data-lucide="wifi" width="24" height="24"></i></span>
      <div class="switch-card__content">
        <span class="switch-card__title">Wi-Fi</span>
      </div>
      <div class="switch-card__toggle switch-card__toggle--on"></div>
    </div>
    <div class="switch-card">
      <span class="switch-card__icon"><i data-lucide="bell" width="24" height="24"></i></span>
      <div class="switch-card__content">
        <span class="switch-card__title">免打扰</span>
      </div>
      <div class="switch-card__toggle"></div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
