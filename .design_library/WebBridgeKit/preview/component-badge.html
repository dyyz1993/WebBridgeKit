<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Badge - WebBridgeKit</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: 12px; background: var(--wbk-background-secondary); font-family: var(--wbk-font-family); color: var(--wbk-text); }
.row { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.label { font: var(--wbk-text-caption1); color: var(--wbk-text-secondary); min-width: 92px; flex-shrink: 0; letter-spacing: .5px; }
hr.divider { border: none; border-top: 1px solid var(--wbk-separator); margin: 12px 0; }

/* @component-css-start */
/* Component definitions — extracted to components.css by deterministic script */
.badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: var(--wbk-radius-full); font: 700 10px/1.3 var(--wbk-font-family); white-space: nowrap; min-width: 22px; }
.badge .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.badge.persistent { background: var(--color-primary-soft); color: var(--color-primary); }
.badge.persistent .dot { background: var(--color-primary); }
.badge.cached { background: var(--wbk-success-soft); color: var(--color-success); }
.badge.cached .dot { background: var(--color-success); }
.badge.needs-update { background: var(--wbk-warning-soft); color: var(--color-warning); }
.badge.needs-update .dot { background: var(--color-warning); }
.badge.not-cached { background: var(--color-bg-tertiary); color: var(--color-text-secondary); }
.badge.not-cached .dot { background: var(--color-text-tertiary); }
.badge.pill { height: 26px; padding: 0 10px; gap: 5px; font: 700 11px/1.3 var(--wbk-font-family); min-width: 26px; }
.badge.pill .dot { width: 7px; height: 7px; }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">状态</span><span class="badge persistent"><span class="dot"></span><span>持久化</span></span><span class="badge cached"><span class="dot"></span><span>已缓存</span></span><span class="badge needs-update"><span class="dot"></span><span>需更新</span></span><span class="badge not-cached"><span class="dot"></span><span>未缓存</span></span></div>
<hr class="divider">
<div class="row"><span class="label">来源</span><span class="badge pill persistent"><span class="dot"></span><span>APNs</span></span><span class="badge pill cached"><span class="dot"></span><span>Bark</span></span><span class="badge pill needs-update"><span class="dot"></span><span>Bridge</span></span><span class="badge pill not-cached"><span class="dot"></span><span>System</span></span></div>
</body>
</html>
