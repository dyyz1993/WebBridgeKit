<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Skeleton - WebBridgeKit</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin:0; padding:12px; background:var(--wbk-background-secondary); font-family:var(--wbk-font-family); }
.stage { display:flex; flex-direction:column; gap:12px; max-width:480px; margin:0 auto; }
.section-title { font:var(--wbk-text-body); font-weight:600; color:var(--wbk-text); margin-bottom:12px; }

/* @component-css-start */
@keyframes skeleton-pulse { 0% { opacity:0.4; } 50% { opacity:1; } 100% { opacity:0.4; } }
.wbk-skeleton { background-color:var(--color-bg-tertiary); animation:skeleton-pulse 1.5s ease-in-out infinite; }
.wbk-skeleton-card { border-radius:var(--radius-md); padding:16px; background-color:var(--color-surface); box-shadow:var(--shadow-card); display:flex; flex-direction:column; gap:12px; }
.wbk-skeleton-card__header { display:flex; align-items:center; gap:12px; }
.wbk-skeleton__circle { width:32px; height:32px; border-radius:50%; flex-shrink:0; }
.wbk-skeleton__bar { height:16px; border-radius:4px; }
.wbk-skeleton-lines { display:flex; flex-direction:column; gap:10px; }
/* @component-css-end */
</style>
</head>
<body>
<div class="stage">
  <div>
    <div class="section-title">卡片骨架</div>
    <div class="wbk-skeleton-card">
      <div class="wbk-skeleton-card__header">
        <div class="wbk-skeleton wbk-skeleton__circle"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:10px;">
          <div class="wbk-skeleton wbk-skeleton__bar" style="width:80%"></div>
          <div class="wbk-skeleton wbk-skeleton__bar" style="width:60%"></div>
        </div>
      </div>
      <div class="wbk-skeleton wbk-skeleton__bar" style="width:40%"></div>
    </div>
  </div>
  <div>
    <div class="section-title">文本行</div>
    <div class="wbk-skeleton-lines">
      <div class="wbk-skeleton wbk-skeleton__bar" style="width:80%"></div>
      <div class="wbk-skeleton wbk-skeleton__bar" style="width:60%"></div>
      <div class="wbk-skeleton wbk-skeleton__bar" style="width:40%"></div>
    </div>
  </div>
</div>
</body>
</html>
