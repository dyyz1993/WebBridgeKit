<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dialog - WebBridgeKit</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: 12px; background: var(--wbk-background-secondary); font-family: var(--wbk-font-family); color: var(--color-text); }
.row { display: flex; gap: var(--space-xl); align-items: flex-start; margin-bottom: var(--space-xl); flex-wrap: wrap; }
.label { width: 92px; font: var(--type-caption); color: var(--color-text-secondary); text-transform: uppercase; flex-shrink: 0; padding-top: 16px; }
.divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-xl) 0; }

/* @component-css-start */
.dialog-backdrop { display: flex; align-items: center; justify-content: center; background: var(--wbk-overlay); border-radius: var(--radius-lg); min-height: 200px; width: 380px; padding: var(--space-lg); }
.dialog { background: var(--color-surface); border-radius: var(--radius-lg); max-width: 320px; width: 100%; padding: var(--space-xl); box-shadow: var(--shadow-card); }
.dialog-icon { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--radius-full); margin-bottom: var(--space-md); }
.dialog-icon.confirmation { background: var(--color-primary-soft); color: var(--color-primary); }
.dialog-icon.destructive { background: var(--wbk-error-soft); color: var(--color-error); }
.dialog-icon.info { background: var(--wbk-info-soft); color: var(--color-info); }
.dialog-title { font: var(--type-body); font-weight: 600; margin: 0 0 var(--space-xs) 0; color: var(--color-text); }
.dialog-body { font: var(--type-body); margin: 0 0 var(--space-md) 0; color: var(--color-text-secondary); line-height: 1.4; }
.dialog-actions { display: flex; gap: var(--space-md); }
.dialog-actions.single { justify-content: center; }
.dialog-actions.single .btn { flex: 0 1 auto; min-width: 120px; }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 var(--space-xl); border-radius: var(--wbk-button-corner-radius); border: none; cursor: pointer; font: var(--type-button); white-space: nowrap; transition: background .15s; flex: 1; }
.btn-primary { background: var(--color-primary); color: #fff; }
.btn-primary:hover { background: var(--color-primary-pressed); }
.btn-secondary { background: var(--color-bg-secondary); color: var(--color-text); }
.btn-secondary:hover { filter: brightness(0.92); }
.btn-error { background: var(--color-error); color: #fff; }
.btn-error:hover { filter: brightness(0.85); }
/* @component-css-end */
</style>
</head>
<body>

<div class="row">
  <span class="label">确认弹窗</span>
  <div class="dialog-backdrop">
    <div class="dialog">
      <div class="dialog-icon confirmation"><i data-lucide="shield-check" width="20" height="20"></i></div>
      <p class="dialog-title">确认操作</p>
      <p class="dialog-body">确定要执行此操作吗？</p>
      <div class="dialog-actions">
        <button class="btn btn-secondary">取消</button>
        <button class="btn btn-primary">确认</button>
      </div>
    </div>
  </div>
</div>

<div class="row">
  <span class="label">警告弹窗</span>
  <div class="dialog-backdrop">
    <div class="dialog">
      <div class="dialog-icon destructive"><i data-lucide="alert-triangle" width="20" height="20"></i></div>
      <p class="dialog-title">删除确认</p>
      <p class="dialog-body">此操作不可撤销，确定要删除吗？</p>
      <div class="dialog-actions">
        <button class="btn btn-secondary">取消</button>
        <button class="btn btn-error">删除</button>
      </div>
    </div>
  </div>
</div>

<hr class="divider">

<div class="row">
  <span class="label">信息弹窗</span>
  <div class="dialog-backdrop">
    <div class="dialog">
      <div class="dialog-icon info"><i data-lucide="info" width="20" height="20"></i></div>
      <p class="dialog-title">操作成功</p>
      <p class="dialog-body">已成功发送推送通知</p>
      <div class="dialog-actions single">
        <button class="btn btn-primary">知道了</button>
      </div>
    </div>
  </div>
</div>

<script>lucide.createIcons();</script>
</body>
</html>
