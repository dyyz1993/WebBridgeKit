<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<title>WebBridgeKit - 用户行</title>
<style>
/* Page scaffold — NOT extracted */
body { margin:0; padding:12px; background:var(--wbk-background-secondary); font-family:var(--wbk-font-family); color:var(--color-text); }
.stage { display:flex; flex-direction:column; gap:12px; }
.section-label { font:var(--type-caption); color:var(--color-text-secondary); margin-bottom:8px; }

/* @component-css-start */
.user-row { display:flex; align-items:center; gap:12px; min-height:48px; padding:0 16px; background:var(--color-surface); border-radius:var(--radius-md); }
.user-row__avatar { width:36px; height:36px; border-radius:18px; background:var(--wbk-primary-soft); color:var(--color-primary); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; flex-shrink:0; }
.user-row__info { flex:1; display:flex; flex-direction:column; gap:2px; min-width:0; }
.user-row__name { font-size:15px; font-weight:500; color:var(--color-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.user-row__subtitle { font-size:12px; color:var(--color-text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.user-row__status { width:10px; height:10px; border-radius:50%; background:var(--color-success); flex-shrink:0; }
/* @component-css-end */
</style>
</head>
<body>

<div class="section-label">用户行 — 带头像 / 带状态</div>
<div class="stage">
  <div class="user-row">
    <div class="user-row__avatar">W</div>
    <div class="user-row__info">
      <div class="user-row__name">张三</div>
      <div class="user-row__subtitle">产品设计师</div>
    </div>
  </div>
  <div class="user-row">
    <div class="user-row__avatar">W</div>
    <div class="user-row__info">
      <div class="user-row__name">李四</div>
      <div class="user-row__subtitle">前端工程师</div>
    </div>
    <div class="user-row__status"></div>
  </div>
  <div class="user-row">
    <div class="user-row__avatar">W</div>
    <div class="user-row__info">
      <div class="user-row__name">王五</div>
      <div class="user-row__subtitle">后端工程师</div>
    </div>
  </div>
  <div class="user-row">
    <div class="user-row__avatar">W</div>
    <div class="user-row__info">
      <div class="user-row__name">赵六</div>
      <div class="user-row__subtitle">UX 研究员</div>
    </div>
    <div class="user-row__status"></div>
  </div>
</div>

</body>
</html>
