<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Notification Banner — WebBridgeKit</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin:0; padding:12px; background:var(--wbk-background-secondary); font-family:var(--wbk-font-family); }
.stage { max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
.story { display:flex; flex-direction:column; gap:6px; align-items:center; }
.story-label { font:var(--wbk-text-caption); color:var(--wbk-text-secondary); letter-spacing:0.5px; align-self:flex-start; }
.rail { display:flex; justify-content:center; width:100%; }

/* @component-css-start */
.notif-banner { max-width:380px; width:100%; background:var(--color-surface); border-radius:var(--radius-md); padding:12px; box-shadow:var(--shadow-card); box-sizing:border-box; }
.notif-banner__row { display:flex; align-items:flex-start; gap:12px; }
.notif-banner__avatar { width:36px; height:36px; border-radius:50%; background:var(--wbk-primary-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:15px; font-weight:600; color:var(--color-primary); }
.notif-banner__body { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.notif-banner__title { font-size:13px; font-weight:600; color:var(--color-text); }
.notif-banner__message { font-size:13px; font-weight:400; color:var(--color-text-secondary); line-height:1.4; }
.notif-banner__time { font-size:11px; color:var(--color-text-tertiary); margin-top:4px; }
/* @component-css-end */
</style>
</head>
<body>
<div class="stage">

<div class="story">
  <div class="story-label">纯文字</div>
  <div class="rail">
    <div class="notif-banner">
      <div class="notif-banner__body">
        <span class="notif-banner__title">系统更新</span>
        <span class="notif-banner__message">新版本 v2.1.0 已发布，包含性能优化</span>
        <span class="notif-banner__time">2分钟前</span>
      </div>
    </div>
  </div>
</div>

<div class="story">
  <div class="story-label">带头像</div>
  <div class="rail">
    <div class="notif-banner">
      <div class="notif-banner__row">
        <div class="notif-banner__avatar">W</div>
        <div class="notif-banner__body">
          <span class="notif-banner__title">系统更新</span>
          <span class="notif-banner__message">新版本 v2.1.0 已发布，包含性能优化</span>
          <span class="notif-banner__time">2分钟前</span>
        </div>
      </div>
    </div>
  </div>
</div>

</div>
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
