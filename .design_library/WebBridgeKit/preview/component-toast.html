<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Toast - WebBridgeKit</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin:0; padding:12px; background:var(--wbk-background-secondary); font-family:var(--wbk-font-family); }
.stage { display:flex; flex-direction:column; gap:12px; align-items:center; max-width:480px; margin:0 auto; }
.story { display:flex; flex-direction:column; align-items:center; gap:8px; width:100%; }
.story-label { font:var(--wbk-text-caption); color:var(--wbk-text-secondary); letter-spacing:0.5px; align-self:flex-start; }
.rail { display:flex; justify-content:center; width:100%; }

/* @component-css-start */
.toast { display:inline-flex; align-items:center; gap:8px; max-width:360px; padding:12px 16px; border-radius:var(--radius-md); min-height:44px; font-size:14px; line-height:1.4; }
.toast--success { background:var(--color-success); color:var(--wbk-text-on-color); }
.toast--error { background:var(--color-error); color:var(--wbk-text-on-color); }
.toast__icon { width:20px; height:20px; flex-shrink:0; display:inline-block; }
/* @component-css-end */
</style>
</head>
<body>
<div class="stage">
  <div class="story">
    <span class="story-label">成功</span>
    <div class="rail">
      <div class="toast toast--success">
        <i data-lucide="check-circle" class="toast__icon"></i>
        <span>已成功发送推送通知</span>
      </div>
    </div>
  </div>
  <div class="story">
    <span class="story-label">错误</span>
    <div class="rail">
      <div class="toast toast--error">
        <i data-lucide="alert-circle" class="toast__icon"></i>
        <span>操作失败，请重试</span>
      </div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
