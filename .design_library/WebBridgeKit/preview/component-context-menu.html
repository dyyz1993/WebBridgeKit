<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Context Menu — WebBridgeKit</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin:0; padding:12px; background:var(--wbk-background-secondary); font-family:var(--wbk-font-family); }
.stage { max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
.story { display:flex; flex-direction:column; gap:6px; }
.story-label { font:var(--wbk-text-caption); color:var(--wbk-text-secondary); letter-spacing:0.5px; }

/* @component-css-start */
.ctx-menu { background:var(--color-surface-elevated); border-radius:var(--radius-md); padding:4px 0; box-shadow:var(--shadow-card); max-width:220px; width:100%; box-sizing:border-box; }
.ctx-menu__item { height:36px; display:flex; align-items:center; gap:10px; padding:0 12px; cursor:pointer; transition:background .12s; }
.ctx-menu__item:hover { background:var(--color-bg-tertiary); }
.ctx-menu__icon { width:16px; height:16px; flex-shrink:0; display:block; color:var(--color-text-secondary); }
.ctx-menu__label { font-size:14px; font-weight:400; color:var(--color-text); }
.ctx-menu__item--danger .ctx-menu__label { color:var(--color-error); }
.ctx-menu__item--danger .ctx-menu__icon { color:var(--color-error); }
.ctx-menu__separator { border:none; border-top:1px solid var(--color-separator); margin:4px 12px; }
/* @component-css-end */
</style>
</head>
<body>
<div class="stage">

<div class="story">
  <div class="story-label">带图标</div>
  <div class="ctx-menu">
    <div class="ctx-menu__item">
      <i data-lucide="pencil" class="ctx-menu__icon"></i>
      <span class="ctx-menu__label">编辑</span>
    </div>
    <div class="ctx-menu__item">
      <i data-lucide="copy" class="ctx-menu__icon"></i>
      <span class="ctx-menu__label">复制</span>
    </div>
    <div class="ctx-menu__item">
      <i data-lucide="share-2" class="ctx-menu__icon"></i>
      <span class="ctx-menu__label">分享</span>
    </div>
    <hr class="ctx-menu__separator">
    <div class="ctx-menu__item ctx-menu__item--danger">
      <i data-lucide="trash-2" class="ctx-menu__icon"></i>
      <span class="ctx-menu__label">删除</span>
    </div>
  </div>
</div>

<div class="story">
  <div class="story-label">纯文字</div>
  <div class="ctx-menu">
    <div class="ctx-menu__item">
      <span class="ctx-menu__label">剪切</span>
    </div>
    <div class="ctx-menu__item">
      <span class="ctx-menu__label">复制</span>
    </div>
    <div class="ctx-menu__item">
      <span class="ctx-menu__label">粘贴</span>
    </div>
  </div>
</div>

</div>
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
