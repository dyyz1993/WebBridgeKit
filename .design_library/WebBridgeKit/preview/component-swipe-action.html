<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Swipe Action — WebBridgeKit</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin:0; padding:12px; background:var(--wbk-background-secondary); font-family:var(--wbk-font-family); }
.stage { max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
.story { display:flex; flex-direction:column; gap:6px; }
.story-label { font:var(--wbk-text-caption); color:var(--wbk-text-secondary); letter-spacing:0.5px; }

/* @component-css-start */
.swipe-action { display:flex; overflow:hidden; border-radius:var(--radius-md); }
.swipe-action__actions { display:flex; align-items:stretch; }
.swipe-action__btn { width:60px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:500; border:none; cursor:pointer; background:var(--color-bg-tertiary); color:var(--color-text); }
.swipe-action__btn--delete { background:var(--color-error); color:#fff; }
.swipe-action__content { display:flex; align-items:center; gap:12px; min-height:48px; padding:12px 16px; background:var(--color-surface); flex-shrink:0; width:100%; box-sizing:border-box; }
.swipe-action__icon { width:36px; height:36px; border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.swipe-action__text { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.swipe-action__title { font-size:15px; font-weight:600; color:var(--color-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.swipe-action__subtitle { font-size:13px; color:var(--color-text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.swipe-action__time { font-size:12px; color:var(--color-text-tertiary); flex-shrink:0; align-self:flex-start; margin-top:2px; }
/* @component-css-end */
</style>
</head>
<body>
<div class="stage">

<div class="story">
  <div class="story-label">静止态</div>
  <div class="swipe-action">
    <div class="swipe-action__content">
      <div class="swipe-action__icon" style="background:var(--wbk-primary-soft);">
        <i data-lucide="file-text" style="width:18px;height:18px;color:var(--color-primary);"></i>
      </div>
      <div class="swipe-action__text">
        <span class="swipe-action__title">项目报告</span>
        <span class="swipe-action__subtitle">Q2 季度总结文档</span>
      </div>
      <span class="swipe-action__time">14:30</span>
    </div>
  </div>
</div>

<div class="story">
  <div class="story-label">露出态</div>
  <div class="swipe-action">
    <div class="swipe-action__actions">
      <button class="swipe-action__btn">编辑</button>
      <button class="swipe-action__btn swipe-action__btn--delete">删除</button>
    </div>
    <div class="swipe-action__content">
      <div class="swipe-action__icon" style="background:var(--wbk-primary-soft);">
        <i data-lucide="file-text" style="width:18px;height:18px;color:var(--color-primary);"></i>
      </div>
      <div class="swipe-action__text">
        <span class="swipe-action__title">项目报告</span>
        <span class="swipe-action__subtitle">Q2 季度总结文档</span>
      </div>
      <span class="swipe-action__time">14:30</span>
    </div>
  </div>
</div>

</div>
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
