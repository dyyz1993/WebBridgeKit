<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<title>WebBridgeKit - 输入组</title>
<style>
/* Page scaffold — NOT extracted */
body { margin:0; padding:12px; background:var(--wbk-background-secondary); font-family:var(--wbk-font-family); color:var(--color-text); }
.stage { display:flex; flex-direction:column; gap:12px; margin-bottom:12px; }
.section-label { font:var(--type-caption); color:var(--color-text-secondary); margin-bottom:8px; }

/* @component-css-start */
.input-group { display:flex; flex-direction:column; gap:8px; background:var(--color-surface); padding:12px; border-radius:var(--radius-md); }
.input-group__label { font-size:14px; font-weight:600; color:var(--color-text); }
.input-group__desc { font-size:12px; color:var(--color-text-secondary); }
.input-group__field { height:44px; border:1px solid var(--color-separator); border-radius:var(--radius-md); background:var(--color-surface); padding:0 12px; font-size:15px; color:var(--color-text); outline:none; box-sizing:border-box; }
.input-group__field:focus { border-color:var(--color-primary); }
.input-group__field::placeholder { color:var(--wbk-placeholder); }
.input-group__error { font-size:12px; color:var(--color-error); }
/* @component-css-end */
</style>
</head>
<body>

<div class="section-label">标准 Form</div>
<div class="stage">
  <div class="input-group">
    <label class="input-group__label">电子邮件</label>
    <span class="input-group__desc">请输入您的邮箱地址</span>
    <input class="input-group__field" type="email" placeholder="name@example.com">
    <span class="input-group__error">邮箱格式不正确</span>
  </div>
  <div class="input-group">
    <label class="input-group__label">密码</label>
    <span class="input-group__desc">至少 8 个字符</span>
    <input class="input-group__field" type="password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;">
  </div>
</div>

<div class="section-label">紧凑</div>
<div class="stage">
  <div class="input-group">
    <label class="input-group__label">用户名</label>
    <input class="input-group__field" type="text" placeholder="请输入用户名">
  </div>
  <div class="input-group">
    <label class="input-group__label">手机号</label>
    <input class="input-group__field" type="tel" placeholder="请输入手机号">
  </div>
</div>

</body>
</html>
