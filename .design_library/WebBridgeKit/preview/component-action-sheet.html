<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ActionSheet - WebBridgeKit</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: 12px; background: var(--wbk-background-secondary); font: var(--type-body); color: var(--color-text); }
.row { display: flex; gap: 24px; align-items: flex-start; margin-bottom: 24px; flex-wrap: wrap; }
.label { width: 92px; font: var(--type-caption); color: var(--color-text-secondary); text-transform: uppercase; flex-shrink: 0; padding-top: 60px; }
.phone-frame { width: 480px; max-width: 100%; height: 360px; background: var(--color-bg-tertiary); border-radius: 16px; overflow: hidden; position: relative; flex-shrink: 0; }
.phone-frame .dummy-content { padding: 20px; color: var(--color-text-secondary); font-size: 14px; }

/* @component-css-start */
.action-sheet-scrim { position: absolute; inset: 0; background: var(--color-overlay); display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; padding: 0 8px 12px 8px; }
.action-group { background: var(--color-surface); border-radius: var(--wbk-radius-sheet); overflow: hidden; }
.action-group + .action-group { margin-top: 8px; }
.action-row { height: 54px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 400; color: var(--color-primary); cursor: pointer; transition: background .12s; user-select: none; }
.action-row:active { background: var(--color-bg-tertiary); }
.action-row + .action-row { border-top: 1px solid var(--color-separator); }
.action-row--destructive { color: var(--color-error); }
.action-row--cancel { font-weight: 600; }
/* @component-css-end */
</style>
</head>
<body>

<div class="row">
  <span class="label">标准操作</span>
  <div class="phone-frame">
    <div class="dummy-content">页面背景内容区域</div>
    <div class="action-sheet-scrim">
      <div class="action-group">
        <div class="action-row">编辑</div>
        <div class="action-row">分享</div>
        <div class="action-row">复制链接</div>
      </div>
      <div class="action-group">
        <div class="action-row action-row--cancel">取消</div>
      </div>
    </div>
  </div>
</div>

<div class="row">
  <span class="label">含删除</span>
  <div class="phone-frame">
    <div class="dummy-content">页面背景内容区域</div>
    <div class="action-sheet-scrim">
      <div class="action-group">
        <div class="action-row">编辑</div>
        <div class="action-row action-row--destructive">删除</div>
      </div>
      <div class="action-group">
        <div class="action-row action-row--cancel">取消</div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
