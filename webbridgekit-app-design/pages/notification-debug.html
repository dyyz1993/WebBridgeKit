<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知调试</title>
    <style id="theme-vars">
:root {
  /* === WBK Brand Colors (Light) === */
  --wbk-background: #F8F9FC;
  --wbk-background-secondary: #F0F2F7;
  --wbk-background-tertiary: #E8EBF2;
  --wbk-surface: #FFFFFF;
  --wbk-surface-elevated: #FFFFFF;
  --wbk-card-background: #FFFFFF;
  --wbk-text: #1A1D2E;
  --wbk-text-secondary: #6B7394;
  --wbk-text-tertiary: #9CA3C4;
  --wbk-placeholder: #A5ADBA;
  --wbk-border: #D8DEE8;
  --wbk-separator: #E6EAF0;
  --wbk-primary: #4F6AF6;
  --wbk-primary-pressed: #3D56E0;
  --wbk-primary-soft: #EEF1FE;
  --wbk-success: #16A34A;
  --wbk-success-soft: #EAF8EF;
  --wbk-warning: #D97706;
  --wbk-warning-soft: #FFF4E5;
  --wbk-error: #DC2626;
  --wbk-error-soft: #FEECEC;
  --wbk-info: #0F766E;
  --wbk-info-soft: #E7F6F4;
  --wbk-overlay: rgba(17,24,39,0.42);
  --wbk-shadow: rgba(17,24,39,0.10);
  --wbk-text-on-color: #FFFFFF;
  --wbk-badge-background: #EEF1FE;
  --wbk-badge-text: #6B7394;
  --wbk-gradient-start: rgba(79,106,246,0.85);
  --wbk-gradient-end: rgba(139,92,246,0.85);

  /* === Typography === */
  --wbk-font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Noto Sans SC', system-ui, 'Helvetica Neue', sans-serif;
  --wbk-font-mono: 'SF Mono', ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, monospace;

  --wbk-text-display-large: 700 34px/1.2 var(--wbk-font-family);
  --wbk-text-display: 700 28px/1.2 var(--wbk-font-family);
  --wbk-text-screen-title: 700 28px/1.2 var(--wbk-font-family);
  --wbk-text-compact-title: 700 24px/1.3 var(--wbk-font-family);
  --wbk-text-section-title: 600 17px/1.3 var(--wbk-font-family);
  --wbk-text-row-title: 500 16px/1.4 var(--wbk-font-family);
  --wbk-text-card-title: 600 16px/1.3 var(--wbk-font-family);
  --wbk-text-body: 400 15px/1.5 var(--wbk-font-family);
  --wbk-text-metadata: 400 13px/1.4 var(--wbk-font-family);
  --wbk-text-caption: 400 12px/1.4 var(--wbk-font-family);
  --wbk-text-tab-label: 500 11px/1.3 var(--wbk-font-family);
  --wbk-text-button: 600 15px/1.3 var(--wbk-font-family);
  --wbk-text-badge: 700 10px/1.3 var(--wbk-font-family);
  --wbk-text-mono-meta: 400 12px/1.4 var(--wbk-font-mono);

  /* === Spacing === */
  --wbk-spacing-xxs: 2px;
  --wbk-spacing-xs: 4px;
  --wbk-spacing-sm: 8px;
  --wbk-spacing-md: 12px;
  --wbk-spacing-lg: 16px;
  --wbk-spacing-xl: 20px;
  --wbk-spacing-xxl: 24px;
  --wbk-spacing-xxxl: 32px;
  --wbk-spacing-section: 32px;
  --wbk-spacing-screen-h: 16px;

  /* === Radius === */
  --wbk-radius-xs: 6px;
  --wbk-radius-sm: 8px;
  --wbk-radius-md: 12px;
  --wbk-radius-lg: 16px;
  --wbk-radius-full: 9999px;

  /* === Shadows === */
  --wbk-shadow-none: none;
  --wbk-shadow-sm: 0 1px 3px rgba(17,24,39,0.08);
  --wbk-shadow-md: 0 2px 8px rgba(17,24,39,0.10);
  --wbk-shadow-card: 0 4px 16px rgba(17,24,39,0.08);
  --wbk-shadow-fab: 0 8px 24px rgba(17,24,39,0.20);

  /* === Animation === */
  --wbk-duration-fast: 0.15s;
  --wbk-duration-normal: 0.25s;
  --wbk-duration-slow: 0.4s;
  --wbk-easing: cubic-bezier(0.25, 0.1, 0.25, 1);
}

/* === Dark Mode === */
@media (prefers-color-scheme: dark) {
  :root {
    --wbk-background: #0F1117;
    --wbk-background-secondary: #1A1D28;
    --wbk-background-tertiary: #252A38;
    --wbk-surface: #13171D;
    --wbk-surface-elevated: #191E26;
    --wbk-card-background: #1E2233;
    --wbk-text: #F0F2F7;
    --wbk-text-secondary: #8892B0;
    --wbk-text-tertiary: #5C6585;
    --wbk-placeholder: #667085;
    --wbk-border: #2A323D;
    --wbk-separator: #232A34;
    --wbk-primary: #6B82F8;
    --wbk-primary-pressed: #4F6AF6;
    --wbk-primary-soft: rgba(107,130,248,0.14);
    --wbk-success: #4ADE80;
    --wbk-success-soft: rgba(74,222,128,0.13);
    --wbk-warning: #FBBF24;
    --wbk-warning-soft: rgba(251,191,36,0.14);
    --wbk-error: #F87171;
    --wbk-error-soft: rgba(248,113,113,0.14);
    --wbk-info: #2DD4BF;
    --wbk-info-soft: rgba(45,212,191,0.13);
    --wbk-overlay: rgba(0,0,0,0.58);
    --wbk-shadow: rgba(0,0,0,0.30);
    --wbk-text-on-color: #FFFFFF;
    --wbk-badge-background: rgba(107,130,248,0.14);
    --wbk-badge-text: #8892B0;
    --wbk-gradient-start: rgba(51,77,153,0.90);
    --wbk-gradient-end: rgba(102,51,128,0.90);
    --wbk-shadow-sm: 0 1px 3px rgba(0,0,0,0.20);
    --wbk-shadow-md: 0 2px 8px rgba(0,0,0,0.25);
    --wbk-shadow-card: 0 4px 16px rgba(0,0,0,0.30);
    --wbk-shadow-fab: 0 8px 24px rgba(0,0,0,0.40);
  }
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--wbk-background);
    --color-primary: var(--wbk-primary);
    --color-border: var(--wbk-border);
  }
  @layer base {
    body { background: var(--wbk-background); color: var(--wbk-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
      <div style="display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;background:var(--wbk-background);font-family:var(--wbk-font-family);color:var(--wbk-text);overflow-x:hidden;-webkit-font-smoothing:antialiased;">

        <!-- iOS Status Bar -->
        <div style="position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 var(--wbk-spacing-lg);padding-top:14px;background:var(--wbk-background);" aria-hidden="true">
          <span style="font:var(--wbk-text-row-title);font-size:15px;font-weight:600;letter-spacing:0.01em;color:var(--wbk-text);min-width:54px;">9:41</span>
          <div style="display:flex;align-items:center;gap:6px;">
            <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><rect x="0" y="9" width="3" height="3" rx="0.5" fill="currentColor"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="currentColor"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="currentColor"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="currentColor"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3z" fill="currentColor"/><path d="M4.93 8.47a4.37 4.37 0 016.14 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M2.1 5.64a8.13 8.13 0 0111.8 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
            <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="23" height="12" rx="2.5" stroke="currentColor" stroke-width="1" opacity="0.4"/><rect x="25" y="4" width="1.5" height="5" rx="0.75" fill="currentColor" opacity="0.4"/><rect x="2" y="2" width="20" height="9" rx="1.5" fill="currentColor"/></svg>
          </div>
        </div>

        <!-- Nav Header -->
        <header style="display:flex;align-items:center;height:44px;padding:0 var(--wbk-spacing-lg);border-bottom:1px solid var(--wbk-separator);background:var(--wbk-background);">
          <button data-dom-id="nav-back" style="display:inline-flex;align-items:center;gap:4px;background:none;border:none;cursor:pointer;color:var(--wbk-primary);padding:0;margin-right:var(--wbk-spacing-md);-webkit-tap-highlight-color:transparent;">
            <i data-lucide="chevron-left" style="width:20px;height:20px;"></i>
            <span style="font:var(--wbk-text-body);font-size:15px;color:var(--wbk-primary);">设置</span>
          </button>
          <h1 style="flex:1;text-align:center;font:var(--wbk-text-row-title);font-size:17px;font-weight:600;color:var(--wbk-text);margin:0;">通知调试</h1>
          <div style="width:60px;"></div>
        </header>

        <!-- Page Content -->
        <div style="flex:1;overflow-y:auto;padding:var(--wbk-spacing-lg);padding-bottom:40px;">

          <!-- Status Card -->
          <div style="background:var(--wbk-card-background);border:1px solid var(--wbk-border);border-radius:var(--wbk-radius-md);padding:var(--wbk-spacing-xxl);margin-bottom:var(--wbk-spacing-xl);">
            <div style="font:var(--wbk-text-section-title);font-size:17px;font-weight:600;color:var(--wbk-text);margin-bottom:var(--wbk-spacing-lg);">推送状态</div>

            <!-- APNs Status -->
            <div style="display:flex;justify-content:space-between;align-items:center;padding:var(--wbk-spacing-md) 0;border-bottom:1px solid var(--wbk-separator);">
              <div style="display:flex;align-items:center;gap:var(--wbk-spacing-sm);">
                <i data-lucide="bell-ring" style="width:16px;height:16px;color:var(--wbk-text-tertiary);"></i>
                <span style="font:var(--wbk-text-body);font-size:15px;color:var(--wbk-text);">APNs 状态</span>
              </div>
              <div style="display:flex;align-items:center;gap:var(--wbk-spacing-xs);">
                <span style="width:8px;height:8px;border-radius:var(--wbk-radius-full);background:var(--wbk-success);"></span>
                <span style="font:var(--wbk-text-metadata);font-size:13px;color:var(--wbk-success);font-weight:500;">已注册</span>
              </div>
            </div>

            <!-- Bark Status -->
            <div style="display:flex;justify-content:space-between;align-items:center;padding:var(--wbk-spacing-md) 0;border-bottom:1px solid var(--wbk-separator);">
              <div style="display:flex;align-items:center;gap:var(--wbk-spacing-sm);">
                <i data-lucide="radio" style="width:16px;height:16px;color:var(--wbk-text-tertiary);"></i>
                <span style="font:var(--wbk-text-body);font-size:15px;color:var(--wbk-text);">Bark 状态</span>
              </div>
              <div style="display:flex;align-items:center;gap:var(--wbk-spacing-xs);">
                <span style="width:8px;height:8px;border-radius:var(--wbk-radius-full);background:var(--wbk-success);"></span>
                <span style="font:var(--wbk-text-metadata);font-size:13px;color:var(--wbk-success);font-weight:500;">已配置</span>
              </div>
            </div>

            <!-- Device Token -->
            <div style="display:flex;justify-content:space-between;align-items:center;padding:var(--wbk-spacing-md) 0;">
              <div style="display:flex;align-items:center;gap:var(--wbk-spacing-sm);">
                <i data-lucide="smartphone" style="width:16px;height:16px;color:var(--wbk-text-tertiary);"></i>
                <span style="font:var(--wbk-text-body);font-size:15px;color:var(--wbk-text);">设备令牌</span>
              </div>
              <span style="font:var(--wbk-text-mono-meta);font-size:12px;color:var(--wbk-text-tertiary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;">a1b2****e5f6</span>
            </div>
          </div>

          <!-- Send Test Notification -->
          <div style="background:var(--wbk-card-background);border:1px solid var(--wbk-border);border-radius:var(--wbk-radius-md);padding:var(--wbk-spacing-xxl);margin-bottom:var(--wbk-spacing-xl);">
            <div style="font:var(--wbk-text-section-title);font-size:17px;font-weight:600;color:var(--wbk-text);margin-bottom:var(--wbk-spacing-lg);">发送测试</div>

            <!-- Title Input -->
            <div style="margin-bottom:var(--wbk-spacing-md);">
              <label style="font:var(--wbk-text-metadata);font-size:13px;color:var(--wbk-text-secondary);display:block;margin-bottom:var(--wbk-spacing-xs);">标题</label>
              <input type="text" value="测试通知" style="width:100%;height:44px;background:var(--wbk-background-secondary);border:1px solid var(--wbk-border);border-radius:var(--wbk-radius-sm);padding:0 var(--wbk-spacing-lg);font:var(--wbk-text-body);font-size:15px;color:var(--wbk-text);outline:none;box-sizing:border-box;">
            </div>

            <!-- Body Input -->
            <div style="margin-bottom:var(--wbk-spacing-md);">
              <label style="font:var(--wbk-text-metadata);font-size:13px;color:var(--wbk-text-secondary);display:block;margin-bottom:var(--wbk-spacing-xs);">正文</label>
              <input type="text" value="这是一条测试推送通知" style="width:100%;height:44px;background:var(--wbk-background-secondary);border:1px solid var(--wbk-border);border-radius:var(--wbk-radius-sm);padding:0 var(--wbk-spacing-lg);font:var(--wbk-text-body);font-size:15px;color:var(--wbk-text);outline:none;box-sizing:border-box;">
            </div>

            <!-- URL Input -->
            <div style="margin-bottom:var(--wbk-spacing-md);">
              <label style="font:var(--wbk-text-metadata);font-size:13px;color:var(--wbk-text-secondary);display:block;margin-bottom:var(--wbk-spacing-xs);">URL</label>
              <input type="text" placeholder="https://example.com" style="width:100%;height:44px;background:var(--wbk-background-secondary);border:1px solid var(--wbk-border);border-radius:var(--wbk-radius-sm);padding:0 var(--wbk-spacing-lg);font:var(--wbk-text-mono-meta);font-size:14px;color:var(--wbk-text);outline:none;box-sizing:border-box;">
            </div>

            <!-- Level Select -->
            <div style="margin-bottom:var(--wbk-spacing-md);">
              <label style="font:var(--wbk-text-metadata);font-size:13px;color:var(--wbk-text-secondary);display:block;margin-bottom:var(--wbk-spacing-xs);">级别</label>
              <select style="width:100%;height:44px;background:var(--wbk-background-secondary);border:1px solid var(--wbk-border);border-radius:var(--wbk-radius-sm);padding:0 var(--wbk-spacing-lg);font:var(--wbk-text-body);font-size:15px;color:var(--wbk-text);outline:none;box-sizing:border-box;appearance:none;">
                <option>active</option>
                <option>timeSensitive</option>
                <option>passive</option>
              </select>
            </div>

            <!-- Sound Toggle -->
            <div style="display:flex;justify-content:space-between;align-items:center;padding:var(--wbk-spacing-md) 0;margin-bottom:var(--wbk-spacing-lg);">
              <span style="font:var(--wbk-text-body);font-size:15px;color:var(--wbk-text);">声音</span>
              <div style="width:51px;height:31px;background:var(--wbk-primary);border-radius:var(--wbk-radius-full);position:relative;cursor:pointer;">
                <div style="width:27px;height:27px;background:#fff;border-radius:var(--wbk-radius-full);position:absolute;top:2px;right:2px;box-shadow:var(--wbk-shadow-sm);"></div>
              </div>
            </div>

            <!-- Send Button -->
            <button style="width:100%;height:48px;background:var(--wbk-primary);color:var(--wbk-text-on-color);border:none;border-radius:var(--wbk-radius-md);font:var(--wbk-text-button);font-size:15px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;">发送测试通知</button>
          </div>

          <!-- Push History -->
          <div style="background:var(--wbk-card-background);border:1px solid var(--wbk-border);border-radius:var(--wbk-radius-md);padding:var(--wbk-spacing-xxl);margin-bottom:var(--wbk-spacing-xl);">
            <div style="font:var(--wbk-text-section-title);font-size:17px;font-weight:600;color:var(--wbk-text);margin-bottom:var(--wbk-spacing-lg);">推送历史</div>

            <!-- History Entry 1 -->
            <div style="padding:var(--wbk-spacing-md) 0;border-bottom:1px solid var(--wbk-separator);">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--wbk-spacing-xs);">
                <span style="font:var(--wbk-text-body);font-size:15px;color:var(--wbk-text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">服务器状态更新</span>
                <span style="font:var(--wbk-text-metadata);font-size:11px;color:var(--wbk-success);font-weight:500;flex-shrink:0;margin-left:var(--wbk-spacing-sm);">成功</span>
              </div>
              <div style="display:flex;justify-content:space-between;">
                <span style="font:var(--wbk-text-caption);font-size:11px;color:var(--wbk-text-tertiary);">APNs</span>
                <span style="font:var(--wbk-text-caption);font-size:11px;color:var(--wbk-text-tertiary);">14:30:22</span>
              </div>
            </div>

            <!-- History Entry 2 -->
            <div style="padding:var(--wbk-spacing-md) 0;border-bottom:1px solid var(--wbk-separator);">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--wbk-spacing-xs);">
                <span style="font:var(--wbk-text-body);font-size:15px;color:var(--wbk-text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">缓存清理完成</span>
                <span style="font:var(--wbk-text-metadata);font-size:11px;color:var(--wbk-success);font-weight:500;flex-shrink:0;margin-left:var(--wbk-spacing-sm);">成功</span>
              </div>
              <div style="display:flex;justify-content:space-between;">
                <span style="font:var(--wbk-text-caption);font-size:11px;color:var(--wbk-text-tertiary);">Bark</span>
                <span style="font:var(--wbk-text-caption);font-size:11px;color:var(--wbk-text-tertiary);">14:25:10</span>
              </div>
            </div>

            <!-- History Entry 3 -->
            <div style="padding:var(--wbk-spacing-md) 0;border-bottom:1px solid var(--wbk-separator);">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--wbk-spacing-xs);">
                <span style="font:var(--wbk-text-body);font-size:15px;color:var(--wbk-text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">版本更新提示</span>
                <span style="font:var(--wbk-text-metadata);font-size:11px;color:var(--wbk-error);font-weight:500;flex-shrink:0;margin-left:var(--wbk-spacing-sm);">失败</span>
              </div>
              <div style="display:flex;justify-content:space-between;">
                <span style="font:var(--wbk-text-caption);font-size:11px;color:var(--wbk-text-tertiary);">APNs</span>
                <span style="font:var(--wbk-text-caption);font-size:11px;color:var(--wbk-text-tertiary);">14:20:05</span>
              </div>
            </div>

            <!-- History Entry 4 -->
            <div style="padding:var(--wbk-spacing-md) 0;border-bottom:1px solid var(--wbk-separator);">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--wbk-spacing-xs);">
                <span style="font:var(--wbk-text-body);font-size:15px;color:var(--wbk-text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">定时提醒</span>
                <span style="font:var(--wbk-text-metadata);font-size:11px;color:var(--wbk-success);font-weight:500;flex-shrink:0;margin-left:var(--wbk-spacing-sm);">成功</span>
              </div>
              <div style="display:flex;justify-content:space-between;">
                <span style="font:var(--wbk-text-caption);font-size:11px;color:var(--wbk-text-tertiary);">Bark</span>
                <span style="font:var(--wbk-text-caption);font-size:11px;color:var(--wbk-text-tertiary);">13:50:18</span>
              </div>
            </div>

            <!-- History Entry 5 -->
            <div style="padding:var(--wbk-spacing-md) 0;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--wbk-spacing-xs);">
                <span style="font:var(--wbk-text-body);font-size:15px;color:var(--wbk-text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">连接测试</span>
                <span style="font:var(--wbk-text-metadata);font-size:11px;color:var(--wbk-success);font-weight:500;flex-shrink:0;margin-left:var(--wbk-spacing-sm);">成功</span>
              </div>
              <div style="display:flex;justify-content:space-between;">
                <span style="font:var(--wbk-text-caption);font-size:11px;color:var(--wbk-text-tertiary);">APNs</span>
                <span style="font:var(--wbk-text-caption);font-size:11px;color:var(--wbk-text-tertiary);">13:45:33</span>
              </div>
            </div>
          </div>

          <!-- Notification Permission -->
          <div style="background:var(--wbk-card-background);border:1px solid var(--wbk-border);border-radius:var(--wbk-radius-md);padding:var(--wbk-spacing-xxl);">
            <div style="font:var(--wbk-text-section-title);font-size:17px;font-weight:600;color:var(--wbk-text);margin-bottom:var(--wbk-spacing-lg);">通知权限</div>

            <div style="display:flex;justify-content:space-between;align-items:center;padding:var(--wbk-spacing-md) 0;border-bottom:1px solid var(--wbk-separator);">
              <span style="font:var(--wbk-text-body);font-size:15px;color:var(--wbk-text);">当前状态</span>
              <div style="display:flex;align-items:center;gap:var(--wbk-spacing-xs);">
                <span style="width:8px;height:8px;border-radius:var(--wbk-radius-full);background:var(--wbk-success);"></span>
                <span style="font:var(--wbk-text-metadata);font-size:13px;color:var(--wbk-success);font-weight:500;">已开启</span>
              </div>
            </div>

            <div style="padding:var(--wbk-spacing-lg) 0 var(--wbk-spacing-md);">
              <button style="width:100%;height:44px;background:var(--wbk-card-background);color:var(--wbk-primary);border:1px solid var(--wbk-primary);border-radius:var(--wbk-radius-md);font:var(--wbk-text-button);font-size:15px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;">请求权限</button>
            </div>

            <span style="font:var(--wbk-text-caption);font-size:12px;color:var(--wbk-text-tertiary);line-height:1.5;">如需接收推送通知，请在系统设置中允许通知权限。推送通知依赖 APNs 服务，需在 Apple Developer 后台配置证书。</span>
          </div>

        </div>
      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
