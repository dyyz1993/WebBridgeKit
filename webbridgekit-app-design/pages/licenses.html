    <style id="theme-vars">
:root {
  /* === WBK Brand Colors (Light) === */
  --wbk-background: #F8F9FC;
  --wbk-background-secondary: #F0F2F7;
  --wbk-background-tertiary: #E8EBF2;
  --wbk-surface: #FFFFFF;
  --wbk-surface-elevated: #FFFFFF;
  --wbk-card-background: #FFFFFF;
  --wbk-text: #1A1D2E;
  --wbk-text-secondary: #6B7394;
  --wbk-text-tertiary: #9CA3C4;
  --wbk-placeholder: #A5ADBA;
  --wbk-border: #D8DEE8;
  --wbk-separator: #E6EAF0;
  --wbk-primary: #4F6AF6;
  --wbk-primary-pressed: #3D56E0;
  --wbk-primary-soft: #EEF1FE;
  --wbk-success: #16A34A;
  --wbk-success-soft: #EAF8EF;
  --wbk-warning: #D97706;
  --wbk-warning-soft: #FFF4E5;
  --wbk-error: #DC2626;
  --wbk-error-soft: #FEECEC;
  --wbk-info: #0F766E;
  --wbk-info-soft: #E7F6F4;
  --wbk-overlay: rgba(17,24,39,0.42);
  --wbk-shadow: rgba(17,24,39,0.10);
  --wbk-text-on-color: #FFFFFF;
  --wbk-badge-background: #EEF1FE;
  --wbk-badge-text: #6B7394;
  --wbk-gradient-start: rgba(79,106,246,0.85);
  --wbk-gradient-end: rgba(139,92,246,0.85);

  /* === Typography === */
  --wbk-font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Noto Sans SC', system-ui, 'Helvetica Neue', sans-serif;
  --wbk-font-mono: 'SF Mono', ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, monospace;

  --wbk-text-display-large: 700 34px/1.2 var(--wbk-font-family);
  --wbk-text-display: 700 28px/1.2 var(--wbk-font-family);
  --wbk-text-screen-title: 700 28px/1.2 var(--wbk-font-family);
  --wbk-text-compact-title: 700 24px/1.3 var(--wbk-font-family);
  --wbk-text-section-title: 600 17px/1.3 var(--wbk-font-family);
  --wbk-text-row-title: 500 16px/1.4 var(--wbk-font-family);
  --wbk-text-card-title: 600 16px/1.3 var(--wbk-font-family);
  --wbk-text-body: 400 15px/1.5 var(--wbk-font-family);
  --wbk-text-metadata: 400 13px/1.4 var(--wbk-font-family);
  --wbk-text-caption: 400 12px/1.4 var(--wbk-font-family);
  --wbk-text-tab-label: 500 11px/1.3 var(--wbk-font-family);
  --wbk-text-button: 600 15px/1.3 var(--wbk-font-family);
  --wbk-text-badge: 700 10px/1.3 var(--wbk-font-family);
  --wbk-text-mono-meta: 400 12px/1.4 var(--wbk-font-mono);

  /* === Spacing === */
  --wbk-spacing-xxs: 2px;
  --wbk-spacing-xs: 4px;
  --wbk-spacing-sm: 8px;
  --wbk-spacing-md: 12px;
  --wbk-spacing-lg: 16px;
  --wbk-spacing-xl: 20px;
  --wbk-spacing-xxl: 24px;
  --wbk-spacing-xxxl: 32px;
  --wbk-spacing-section: 32px;
  --wbk-spacing-screen-h: 16px;

  /* === Radius === */
  --wbk-radius-xs: 6px;
  --wbk-radius-sm: 8px;
  --wbk-radius-md: 12px;
  --wbk-radius-lg: 16px;
  --wbk-radius-full: 9999px;

  /* === Shadows === */
  --wbk-shadow-none: none;
  --wbk-shadow-sm: 0 1px 3px rgba(17,24,39,0.08);
  --wbk-shadow-md: 0 2px 8px rgba(17,24,39,0.10);
  --wbk-shadow-card: 0 4px 16px rgba(17,24,39,0.08);
  --wbk-shadow-fab: 0 8px 24px rgba(17,24,39,0.20);

  /* === Animation === */
  --wbk-duration-fast: 0.15s;
  --wbk-duration-normal: 0.25s;
  --wbk-duration-slow: 0.4s;
  --wbk-easing: cubic-bezier(0.25, 0.1, 0.25, 1);
}

/* === Dark Mode === */
@media (prefers-color-scheme: dark) {
  :root {
    --wbk-background: #0F1117;
    --wbk-background-secondary: #1A1D28;
    --wbk-background-tertiary: #252A38;

    --wbk-surface-elevated: #191E26;
    --wbk-card-background: #1E2233;
    --wbk-text: #F0F2F7;
    --wbk-text-secondary: #8892B0;
    --wbk-text-tertiary: #5C6585;
    --wbk-placeholder: #667085;
    --wbk-border: #2A323D;
    --wbk-separator: #232A34;
    --wbk-primary: #6B82F8;
    --wbk-primary-pressed: #4F6AF6;
    --wbk-primary-soft: rgba(107,130,248,0.14);
    --wbk-success: #4ADE80;
    --wbk-success-soft: rgba(74,222,128,0.13);
    --wbk-warning: #FBBF24;
    --wbk-warning-soft: rgba(251,191,36,0.14);
    --wbk-error: #F87171;
    --wbk-error-soft: rgba(248,113,113,0.14);
    --wbk-info: #2DD4BF;
    --wbk-info-soft: rgba(45,212,191,0.13);
    --wbk-overlay: rgba(0,0,0,0.58);
    --wbk-shadow: rgba(0,0,0,0.30);
    --wbk-text-on-color: #FFFFFF;
    --wbk-badge-background: rgba(107,130,248,0.14);
    --wbk-badge-text: #8892B0;
    --wbk-gradient-start: rgba(51,77,153,0.90);
    --wbk-gradient-end: rgba(102,51,128,0.90);
    --wbk-shadow-sm: 0 1px 3px rgba(0,0,0,0.20);
    --wbk-shadow-md: 0 2px 8px rgba(0,0,0,0.25);
    --wbk-shadow-card: 0 4px 16px rgba(0,0,0,0.30);
    --wbk-shadow-fab: 0 8px 24px rgba(0,0,0,0.40);
  }
}

    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--wbk-background);
    --color-primary: var(--wbk-primary);
    --color-border: var(--wbk-border);
  }
  @layer base {
    body { background: var(--wbk-background); color: var(--wbk-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

<style>
/* === Licenses Page Shell === */
.wbk-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--wbk-background);
  font-family: var(--wbk-font-family);
  color: var(--wbk-text);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
.wbk-status-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 54px;
  padding: 0 var(--wbk-spacing-lg);
  padding-top: 14px;
  background: var(--wbk-background);
}
.wbk-status-bar-time {
  font: var(--wbk-text-row-title);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: var(--wbk-text);
  min-width: 54px;
}
.wbk-status-bar-icons {
  display: flex;
  align-items: center;
  gap: 6px;
}
.wbk-status-bar-icons svg { color: var(--wbk-text); }
.wbk-page-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}
.wbk-nav-header {
  display: flex;
  align-items: center;
  height: 44px;
  padding: 0 var(--wbk-spacing-lg);
  position: relative;
}
.wbk-nav-back {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: none;
  border: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  color: var(--wbk-primary);
  font: var(--wbk-text-body);
  font-size: 17px;
  padding: 0;
  transition: opacity var(--wbk-duration-fast) var(--wbk-easing);
}
.wbk-nav-back:active { opacity: 0.6; }
.wbk-nav-back i { width: 20px; height: 20px; }
.wbk-nav-title {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font: var(--wbk-text-row-title);
  font-size: 17px;
  font-weight: 600;
  color: var(--wbk-text);
  white-space: nowrap;
}
.wbk-safe-bottom {
  height: env(safe-area-inset-bottom, 34px);
  background: var(--wbk-background);
}
/* Licenses specific */
.wbk-search-bar {
  margin: var(--wbk-spacing-md) var(--wbk-spacing-lg);
  height: 44px;
  display: flex;
  align-items: center;
  padding: 0 var(--wbk-spacing-lg);
  background: var(--wbk-background-secondary);
  border-radius: var(--wbk-radius-md);
  gap: var(--wbk-spacing-sm);
}
.wbk-search-bar i {
  width: 16px;
  height: 16px;
  color: var(--wbk-text-tertiary);
  flex-shrink: 0;
}
.wbk-search-input {
  flex: 1;
  border: none;
  background: none;
  font: var(--wbk-text-body);
  font-size: 15px;
  color: var(--wbk-text);
  outline: none;
  min-width: 0;
}
.wbk-search-input::placeholder {
  color: var(--wbk-placeholder);
}
.wbk-license-list {
  margin: var(--wbk-spacing-sm) var(--wbk-spacing-lg);
  border-radius: var(--wbk-radius-md);
  border: 1px solid var(--wbk-separator);
  overflow: hidden;
  background: var(--wbk-card-background);
}
.wbk-license-row {
  display: flex;
  align-items: center;
  padding: var(--wbk-spacing-md) var(--wbk-spacing-lg);
  min-height: 56px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background var(--wbk-duration-fast) var(--wbk-easing);
}
.wbk-license-row:active {
  background: var(--wbk-background-secondary);
}
.wbk-license-row + .wbk-license-row {
  border-top: 1px solid var(--wbk-separator);
}
.wbk-license-info {
  flex: 1;
  min-width: 0;
}
.wbk-license-name {
  font: var(--wbk-text-body);
  font-size: 15px;
  font-weight: 500;
  color: var(--wbk-text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.wbk-license-right {
  display: flex;
  align-items: center;
  gap: var(--wbk-spacing-sm);
  flex-shrink: 0;
  margin-left: var(--wbk-spacing-md);
}
.wbk-license-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 22px;
  padding: 0 var(--wbk-spacing-sm);
  border-radius: var(--wbk-radius-xs);
  font: var(--wbk-text-caption);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}
.wbk-badge-mit {
  background: var(--wbk-success-soft);
  color: var(--wbk-success);
}
.wbk-badge-apache {
  background: var(--wbk-primary-soft);
  color: var(--wbk-primary);
}
.wbk-badge-bsd {
  background: var(--wbk-info-soft);
  color: var(--wbk-info);
}
.wbk-license-chevron {
  color: var(--wbk-text-tertiary);
}
.wbk-license-chevron i { width: 16px; height: 16px; }
.wbk-license-footer {
  text-align: center;
  padding: var(--wbk-spacing-xl) var(--wbk-spacing-lg) var(--wbk-spacing-xxl);
  font: var(--wbk-text-caption);
  font-size: 12px;
  color: var(--wbk-text-tertiary);
}
</style>
