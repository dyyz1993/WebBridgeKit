  --wbk-text-badge: 700 10px/1.3 var(--wbk-font-family);
  --wbk-text-mono-meta: 400 12px/1.4 var(--wbk-font-mono);

  /* === Spacing === */
  --wbk-spacing-xxs: 2px;
  --wbk-spacing-xs: 4px;
  --wbk-spacing-sm: 8px;
  --wbk-spacing-md: 12px;
  --wbk-spacing-lg: 16px;
  --wbk-spacing-xl: 20px;
  --wbk-spacing-xxl: 24px;
  --wbk-spacing-xxxl: 32px;
  --wbk-spacing-section: 32px;
  --wbk-spacing-screen-h: 16px;

  /* === Radius === */
  --wbk-radius-xs: 6px;
  --wbk-radius-sm: 8px;
  --wbk-radius-md: 12px;
  --wbk-radius-lg: 16px;
  --wbk-radius-full: 9999px;

  /* === Shadows === */
  --wbk-shadow-none: none;
  --wbk-shadow-sm: 0 1px 3px rgba(17,24,39,0.08);
  --wbk-shadow-md: 0 2px 8px rgba(17,24,39,0.10);
  --wbk-shadow-card: 0 4px 16px rgba(17,24,39,0.08);
  --wbk-shadow-fab: 0 8px 24px rgba(17,24,39,0.20);

  /* === Animation === */
  --wbk-duration-fast: 0.15s;
  --wbk-duration-normal: 0.25s;

}

<style>
/* === Cache Dashboard Page Shell === */
.wbk-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--wbk-background);
  font-family: var(--wbk-font-family);
  color: var(--wbk-text);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
.wbk-status-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 54px;
  padding: 0 var(--wbk-spacing-lg);
  padding-top: 14px;
  background: var(--wbk-background);
}
.wbk-status-bar-time {
  font: var(--wbk-text-row-title);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: var(--wbk-text);
  min-width: 54px;
}
.wbk-status-bar-icons {
  display: flex;
  align-items: center;
  gap: 6px;
}
.wbk-status-bar-icons svg { color: var(--wbk-text); }
.wbk-page-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}
.wbk-nav-header {
  display: flex;
  align-items: center;
  height: 44px;
  padding: 0 var(--wbk-spacing-lg);
  position: relative;
}
.wbk-nav-back {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: none;
  border: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  color: var(--wbk-primary);
  font: var(--wbk-text-body);
  font-size: 17px;
  padding: 0;
  transition: opacity var(--wbk-duration-fast) var(--wbk-easing);
}
.wbk-nav-back:active { opacity: 0.6; }
.wbk-nav-back i { width: 20px; height: 20px; }
.wbk-nav-title {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font: var(--wbk-text-row-title);
  font-size: 17px;
  font-weight: 600;
  color: var(--wbk-text);
  white-space: nowrap;
}
.wbk-safe-bottom {
  height: env(safe-area-inset-bottom, 34px);
  background: var(--wbk-background);
}
/* Cache Dashboard specific */
.wbk-summary-tiles {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--wbk-spacing-sm);
  margin: var(--wbk-spacing-lg);
}
.wbk-tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: var(--wbk-spacing-md) var(--wbk-spacing-xs);
  background: var(--wbk-card-background);
  border: 1px solid var(--wbk-separator);
  border-radius: var(--wbk-radius-md);
}
.wbk-tile-value {
  font: var(--wbk-text-row-title);
  font-size: 16px;
  font-weight: 700;
  color: var(--wbk-text);
  margin-bottom: 2px;
  white-space: nowrap;
}
.wbk-tile-label {
  font: var(--wbk-text-caption);
  font-size: 11px;
  color: var(--wbk-text-tertiary);
  white-space: nowrap;
}
.wbk-storage-section {
  margin: 0 var(--wbk-spacing-lg) var(--wbk-spacing-lg);
  padding: var(--wbk-spacing-lg);
  background: var(--wbk-card-background);
  border: 1px solid var(--wbk-separator);
  border-radius: var(--wbk-radius-md);
}
.wbk-storage-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: var(--wbk-spacing-md);
}
.wbk-storage-title {
  font: var(--wbk-text-section-title);
  font-size: 15px;
  font-weight: 600;
  color: var(--wbk-text);
}
.wbk-storage-detail {
  font: var(--wbk-text-metadata);
  font-size: 13px;
  color: var(--wbk-text-secondary);
}
.wbk-progress-track {
  width: 100%;
  height: 8px;
  background: var(--wbk-background-tertiary);
  border-radius: var(--wbk-radius-full);
  overflow: hidden;
}
.wbk-progress-fill {
  height: 100%;
  width: 4.8%;
  background: var(--wbk-primary);
  border-radius: var(--wbk-radius-full);
  transition: width var(--wbk-duration-normal) var(--wbk-easing);
}
.wbk-section {
  padding: var(--wbk-spacing-sm) var(--wbk-spacing-lg) 0;
  margin-bottom: var(--wbk-spacing-md);
}
.wbk-section-title {
  font: var(--wbk-text-section-title);
  font-size: 13px;
  font-weight: 600;
  color: var(--wbk-text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.02em;
  padding: var(--wbk-spacing-sm) 0 var(--wbk-spacing-xs);
}
.wbk-subsystem-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--wbk-spacing-sm);
}
.wbk-subsystem-card {
  padding: var(--wbk-spacing-lg);
  background: var(--wbk-card-background);
  border: 1px solid var(--wbk-separator);
  border-radius: var(--wbk-radius-md);
}
.wbk-subsystem-header {
  display: flex;
  align-items: center;
  gap: var(--wbk-spacing-sm);
  margin-bottom: var(--wbk-spacing-sm);
}
.wbk-subsystem-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: var(--wbk-radius-sm);
  background: var(--wbk-primary-soft);
  flex-shrink: 0;
}
.wbk-subsystem-icon i { width: 16px; height: 16px; color: var(--wbk-primary); }
.wbk-subsystem-name {
  font: var(--wbk-text-body);
  font-size: 14px;
  font-weight: 600;
  color: var(--wbk-text);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.wbk-subsystem-size {
  font: var(--wbk-text-metadata);
  font-size: 13px;
  color: var(--wbk-text-secondary);
  margin-bottom: 2px;
}
.wbk-status-dot {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font: var(--wbk-text-caption);
  font-size: 12px;
}
.wbk-status-dot::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.wbk-status-dot--active::before {
  background: var(--wbk-success);
}
.wbk-status-dot--idle::before {
  background: var(--wbk-text-tertiary);
}
.wbk-status-dot--active { color: var(--wbk-success); }
.wbk-status-dot--idle { color: var(--wbk-text-tertiary); }
.wbk-action-row {
  display: flex;
  gap: var(--wbk-spacing-sm);
  padding: var(--wbk-spacing-lg);
}
.wbk-btn-danger {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  background: var(--wbk-error);
  color: var(--wbk-text-on-color);
  border: none;
  border-radius: var(--wbk-radius-md);
  font: var(--wbk-text-button);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: opacity var(--wbk-duration-fast) var(--wbk-easing);
}
.wbk-btn-danger:active { opacity: 0.85; }
.wbk-btn-primary {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  background: var(--wbk-primary);
  color: var(--wbk-text-on-color);
  border: none;
  border-radius: var(--wbk-radius-md);
  font: var(--wbk-text-button);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background var(--wbk-duration-fast) var(--wbk-easing), opacity var(--wbk-duration-fast) var(--wbk-easing);
}
.wbk-btn-primary:active { background: var(--wbk-primary-pressed); opacity: 0.85; }
.wbk-activity-list {
  margin: var(--wbk-spacing-sm) var(--wbk-spacing-lg);
  background: var(--wbk-card-background);
  border: 1px solid var(--wbk-separator);
  border-radius: var(--wbk-radius-md);
  overflow: hidden;
}
.wbk-activity-row {
  display: flex;
  align-items: center;
  padding: var(--wbk-spacing-md) var(--wbk-spacing-lg);
  min-height: 48px;
}
.wbk-activity-row + .wbk-activity-row {
  border-top: 1px solid var(--wbk-separator);
}
.wbk-activity-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: var(--wbk-spacing-md);
  flex-shrink: 0;
}
.wbk-activity-dot--hit { background: var(--wbk-success); }
.wbk-activity-dot--miss { background: var(--wbk-error); }
.wbk-activity-info {
  flex: 1;
  min-width: 0;
}
.wbk-activity-name {
  font: var(--wbk-text-body);
  font-size: 14px;
  color: var(--wbk-text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.wbk-activity-time {
  font: var(--wbk-text-caption);
  font-size: 12px;
  color: var(--wbk-text-tertiary);
  flex-shrink: 0;
  margin-left: var(--wbk-spacing-sm);
}
.wbk-activity-tag {
  font: var(--wbk-text-caption);
  font-size: 11px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: var(--wbk-radius-xs);
  white-space: nowrap;
  margin-right: var(--wbk-spacing-sm);
  flex-shrink: 0;
}
.wbk-activity-tag--hit { background: var(--wbk-success-soft); color: var(--wbk-success); }
.wbk-activity-tag--miss { background: var(--wbk-error-soft); color: var(--wbk-error); }
</style>
