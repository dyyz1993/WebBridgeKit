<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR 扫码</title>
    <style id="theme-vars">
:root {
  /* === WBK Brand Colors (Light) === */
  --wbk-background: #F8F9FC;
  --wbk-background-secondary: #F0F2F7;
  --wbk-background-tertiary: #E8EBF2;
  --wbk-surface: #FFFFFF;
  --wbk-surface-elevated: #FFFFFF;
  --wbk-card-background: #FFFFFF;
  --wbk-text: #1A1D2E;
  --wbk-text-secondary: #6B7394;
  --wbk-text-tertiary: #9CA3C4;
  --wbk-placeholder: #A5ADBA;
  --wbk-border: #D8DEE8;
  --wbk-separator: #E6EAF0;
  --wbk-primary: #4F6AF6;
  --wbk-primary-pressed: #3D56E0;
  --wbk-primary-soft: #EEF1FE;
  --wbk-success: #16A34A;
  --wbk-success-soft: #EAF8EF;
  --wbk-warning: #D97706;
  --wbk-warning-soft: #FFF4E5;
  --wbk-error: #DC2626;
  --wbk-error-soft: #FEECEC;
  --wbk-info: #0F766E;
  --wbk-info-soft: #E7F6F4;
  --wbk-overlay: rgba(17,24,39,0.42);
  --wbk-shadow: rgba(17,24,39,0.10);
  --wbk-text-on-color: #FFFFFF;
  --wbk-badge-background: #EEF1FE;
  --wbk-badge-text: #6B7394;
  --wbk-gradient-start: rgba(79,106,246,0.85);
  --wbk-gradient-end: rgba(139,92,246,0.85);

  /* === Typography === */
  --wbk-font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Noto Sans SC', system-ui, 'Helvetica Neue', sans-serif;
  --wbk-font-mono: 'SF Mono', ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, monospace;

  --wbk-text-display-large: 700 34px/1.2 var(--wbk-font-family);
  --wbk-text-display: 700 28px/1.2 var(--wbk-font-family);
  --wbk-text-screen-title: 700 28px/1.2 var(--wbk-font-family);
  --wbk-text-compact-title: 700 24px/1.3 var(--wbk-font-family);
  --wbk-text-section-title: 600 17px/1.3 var(--wbk-font-family);
  --wbk-text-row-title: 500 16px/1.4 var(--wbk-font-family);
  --wbk-text-card-title: 600 16px/1.3 var(--wbk-font-family);
  --wbk-text-body: 400 15px/1.5 var(--wbk-font-family);
  --wbk-text-metadata: 400 13px/1.4 var(--wbk-font-family);
  --wbk-text-caption: 400 12px/1.4 var(--wbk-font-family);
  --wbk-text-tab-label: 500 11px/1.3 var(--wbk-font-family);
  --wbk-text-button: 600 15px/1.3 var(--wbk-font-family);
  --wbk-text-badge: 700 10px/1.3 var(--wbk-font-family);
  --wbk-text-mono-meta: 400 12px/1.4 var(--wbk-font-mono);

  /* === Spacing === */
  --wbk-spacing-xxs: 2px;
  --wbk-spacing-xs: 4px;
  --wbk-spacing-sm: 8px;
  --wbk-spacing-md: 12px;
  --wbk-spacing-lg: 16px;
  --wbk-spacing-xl: 20px;
  --wbk-spacing-xxl: 24px;
  --wbk-spacing-xxxl: 32px;
  --wbk-spacing-section: 32px;
  --wbk-spacing-screen-h: 16px;

  /* === Radius === */
  --wbk-radius-xs: 6px;
  --wbk-radius-sm: 8px;
  --wbk-radius-md: 12px;
  --wbk-radius-lg: 16px;
  --wbk-radius-full: 9999px;

  /* === Shadows === */
  --wbk-shadow-none: none;
  --wbk-shadow-sm: 0 1px 3px rgba(17,24,39,0.08);
  --wbk-shadow-md: 0 2px 8px rgba(17,24,39,0.10);
  --wbk-shadow-card: 0 4px 16px rgba(17,24,39,0.08);
  --wbk-shadow-fab: 0 8px 24px rgba(17,24,39,0.20);

  /* === Animation === */
  --wbk-duration-fast: 0.15s;
  --wbk-duration-normal: 0.25s;
  --wbk-duration-slow: 0.4s;
  --wbk-easing: cubic-bezier(0.25, 0.1, 0.25, 1);
}

/* === Dark Mode === */
@media (prefers-color-scheme: dark) {
  :root {
    --wbk-background: #0F1117;
    --wbk-background-secondary: #1A1D28;
    --wbk-background-tertiary: #252A38;
    --wbk-surface: #13171D;
    --wbk-surface-elevated: #191E26;
    --wbk-card-background: #1E2233;
    --wbk-text: #F0F2F7;
    --wbk-text-secondary: #8892B0;
    --wbk-text-tertiary: #5C6585;
    --wbk-placeholder: #667085;
    --wbk-border: #2A323D;
    --wbk-separator: #232A34;
    --wbk-primary: #6B82F8;
    --wbk-primary-pressed: #4F6AF6;
    --wbk-primary-soft: rgba(107,130,248,0.14);
    --wbk-success: #4ADE80;
    --wbk-success-soft: rgba(74,222,128,0.13);
    --wbk-warning: #FBBF24;
    --wbk-warning-soft: rgba(251,191,36,0.14);
    --wbk-error: #F87171;
    --wbk-error-soft: rgba(248,113,113,0.14);
    --wbk-info: #2DD4BF;
    --wbk-info-soft: rgba(45,212,191,0.13);
    --wbk-overlay: rgba(0,0,0,0.58);
    --wbk-shadow: rgba(0,0,0,0.30);
    --wbk-text-on-color: #FFFFFF;
    --wbk-badge-background: rgba(107,130,248,0.14);
    --wbk-badge-text: #8892B0;
    --wbk-gradient-start: rgba(51,77,153,0.90);
    --wbk-gradient-end: rgba(102,51,128,0.90);
    --wbk-shadow-sm: 0 1px 3px rgba(0,0,0,0.20);
    --wbk-shadow-md: 0 2px 8px rgba(0,0,0,0.25);
    --wbk-shadow-card: 0 4px 16px rgba(0,0,0,0.30);
    --wbk-shadow-fab: 0 8px 24px rgba(0,0,0,0.40);
  }
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--wbk-background);
    --color-primary: var(--wbk-primary);
    --color-border: var(--wbk-border);
  }
  @layer base {
    body { background: var(--wbk-background); color: var(--wbk-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>

<div class="wbk-shell" style="min-height: 100vh;">

  <!-- iOS Status Bar -->
  <div class="wbk-status-bar" aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; background: transparent; z-index: 110;">
    <span class="wbk-status-bar-time" style="color: var(--wbk-text-on-color);">9:41</span>
    <div class="wbk-status-bar-icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><rect x="0" y="9" width="3" height="3" rx="0.5" fill="currentColor"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="currentColor"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="currentColor"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="currentColor"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3z" fill="currentColor"/><path d="M4.93 8.47a4.37 4.37 0 016.14 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M2.1 5.64a8.13 8.13 0 0111.8 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="23" height="12" rx="2.5" stroke="currentColor" stroke-width="1" opacity="0.4"/><rect x="25" y="4" width="1.5" height="5" rx="0.75" fill="currentColor" opacity="0.4"/><rect x="2" y="2" width="20" height="9" rx="1.5" fill="currentColor"/></svg>
    </div>
  </div>

  <!-- Page Content -->
  <div class="wbk-page-content" style="position: relative; flex: 1;">

    <!-- Back/Close button overlay -->
    <button data-dom-id="nav-back" style="position: absolute; top: 60px; left: 16px; z-index: 120; width: 40px; height: 40px; border-radius: var(--wbk-radius-full); background: rgba(255,255,255,0.15); backdrop-filter: blur(8px); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer;" aria-label="返回">
      <i data-icon="chevron-left" style="width: 22px; height: 22px; color: white;"></i>
    </button>

    <!-- Camera Preview Area (dark background simulating viewfinder) -->
    <div class="relative" style="background: #0A0C14; min-height: 55vh;">

      <!-- Flash Toggle Button - Top Right -->
      <div class="absolute flex justify-end px-4 py-3" style="top: 54px; left: 0; right: 0; z-index: 20;">
        <button class="flex items-center justify-center" style="width: 40px; height: 40px; border-radius: var(--wbk-radius-full); background: rgba(255,255,255,0.15); backdrop-filter: blur(8px);" data-dom-id="flash-toggle" aria-label="手电筒">
          <i data-lucide="flashlight" class="w-5 h-5" style="color: var(--wbk-text-on-color);"></i>
        </button>
      </div>

      <!-- Scan Viewfinder Frame - Centered -->
      <div class="absolute inset-0 flex items-center justify-center" style="top: 54px;">
        <div class="relative" style="width: 200px; height: 200px;">

          <!-- Top-left corner -->
          <div class="absolute" style="top: 0; left: 0; width: 28px; height: 28px; border-top: 3px solid #FFFFFF; border-left: 3px solid #FFFFFF; border-top-left-radius: 4px;"></div>
          <!-- Top-right corner -->
          <div class="absolute" style="top: 0; right: 0; width: 28px; height: 28px; border-top: 3px solid #FFFFFF; border-right: 3px solid #FFFFFF; border-top-right-radius: 4px;"></div>
          <!-- Bottom-left corner -->
          <div class="absolute" style="bottom: 0; left: 0; width: 28px; height: 28px; border-bottom: 3px solid #FFFFFF; border-left: 3px solid #FFFFFF; border-bottom-left-radius: 4px;"></div>
          <!-- Bottom-right corner -->
          <div class="absolute" style="bottom: 0; right: 0; width: 28px; height: 28px; border-bottom: 3px solid #FFFFFF; border-right: 3px solid #FFFFFF; border-bottom-right-radius: 4px;"></div>

          <!-- Scanning Line Animation -->
          <div class="absolute left-3 right-3" style="top: 50%; height: 2px; background: var(--wbk-primary); box-shadow: 0 0 8px var(--wbk-primary); animation: qrScanLine 2s ease-in-out infinite; transform: translateY(-50%);"></div>

        </div>
      </div>

    </div>

    <!-- Scanning Line Keyframes -->
    <style>
      @keyframes qrScanLine {
        0%, 100% { top: 20%; opacity: 0.6; }
        50% { top: 80%; opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        @keyframes qrScanLine {
          0%, 100% { top: 50%; opacity: 1; }
        }
      }
    </style>

    <!-- Bottom Frosted Glass Panel -->
    <div style="background: var(--wbk-surface); border-radius: 24px 24px 0 0; margin-top: -20px; position: relative; z-index: 10; padding: 20px var(--wbk-spacing-lg) 32px;">

      <!-- Hint Text -->
      <p class="text-center mb-5" style="font: var(--wbk-text-body); color: var(--wbk-text-secondary);">将二维码放入框内，即可自动扫描</p>

      <!-- Action Buttons Row -->
      <div class="flex items-center justify-center gap-6 mb-6">
        <button class="flex flex-col items-center gap-1.5" style="background: none; border: none; cursor: pointer;">
          <div class="flex items-center justify-center" style="width: 44px; height: 44px; border-radius: var(--wbk-radius-full); background: var(--wbk-background-secondary);">
            <i data-lucide="image" class="w-5 h-5" style="color: var(--wbk-text-secondary);"></i>
          </div>
          <span style="font: var(--wbk-text-caption); color: var(--wbk-text-tertiary);">相册</span>
        </button>
        <button class="flex flex-col items-center gap-1.5" style="background: none; border: none; cursor: pointer;">
          <div class="flex items-center justify-center" style="width: 44px; height: 44px; border-radius: var(--wbk-radius-full); background: var(--wbk-background-secondary);">
            <i data-lucide="flashlight" class="w-5 h-5" style="color: var(--wbk-text-secondary);"></i>
          </div>
          <span style="font: var(--wbk-text-caption); color: var(--wbk-text-tertiary);">手电筒</span>
        </button>
        <button class="flex flex-col items-center gap-1.5" style="background: none; border: none; cursor: pointer;">
          <div class="flex items-center justify-center" style="width: 44px; height: 44px; border-radius: var(--wbk-radius-full); background: var(--wbk-background-secondary);">
            <i data-lucide="history" class="w-5 h-5" style="color: var(--wbk-text-secondary);"></i>
          </div>
          <span style="font: var(--wbk-text-caption); color: var(--wbk-text-tertiary);">历史</span>
        </button>
      </div>

      <!-- Recent Scans Section -->
      <div>
        <h3 class="mb-3" style="font: var(--wbk-text-section-title); color: var(--wbk-text);">最近扫描 (2)</h3>
        <div class="flex flex-col gap-2">

          <!-- Recent Scan 1 -->
          <div class="flex items-center gap-3 px-3 py-2.5" style="background: var(--wbk-background-secondary); border-radius: var(--wbk-radius-md);">
            <div class="flex items-center justify-center shrink-0" style="width: 32px; height: 32px; border-radius: var(--wbk-radius-xs); background: var(--wbk-primary-soft);">
              <i data-lucide="qr-code" class="w-4 h-4" style="color: var(--wbk-primary);"></i>
            </div>
            <div class="flex-1 min-w-0">
              <p class="truncate" style="font: var(--wbk-text-row-title); font-size: 13px; color: var(--wbk-text);">https://github.com/webbridgekit</p>
              <p style="font: var(--wbk-text-caption); color: var(--wbk-text-tertiary);">URL - 今天 14:30</p>
            </div>
            <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: var(--wbk-text-tertiary);"></i>
          </div>

          <!-- Recent Scan 2 -->
          <div class="flex items-center gap-3 px-3 py-2.5" style="background: var(--wbk-background-secondary); border-radius: var(--wbk-radius-md);">
            <div class="flex items-center justify-center shrink-0" style="width: 32px; height: 32px; border-radius: var(--wbk-radius-xs); background: var(--wbk-success-soft);">
              <i data-lucide="wifi" class="w-4 h-4" style="color: var(--wbk-success);"></i>
            </div>
            <div class="flex-1 min-w-0">
              <p class="truncate" style="font: var(--wbk-text-row-title); font-size: 13px; color: var(--wbk-text);">WIFI:T:WPA;S:HomeNetwork;P:****</p>
              <p style="font: var(--wbk-text-caption); color: var(--wbk-text-tertiary);">WiFi - 昨天 10:15</p>
            </div>
            <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: var(--wbk-text-tertiary);"></i>
          </div>

        </div>
      </div>

    </div>

  </div>

</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>

    </main>
</body>
</html>
