<!-- ============================================
     WebBridgeKit iOS App — Project Shell Partial
     Shared frame: iOS status bar + bottom tab bar + page content slot
     This is a PARTIAL (fragment), NOT a full HTML document.
============================================= -->

<style>
/* === Project Shell Styles === */
.wbk-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--wbk-background);
  font-family: var(--wbk-font-family);
  color: var(--wbk-text);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* iOS Status Bar */
.wbk-status-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 54px;
  padding: 0 var(--wbk-spacing-lg);
  padding-top: 14px;
  background: var(--wbk-background);
}

.wbk-status-bar-time {
  font: var(--wbk-text-row-title);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: var(--wbk-text);
  min-width: 54px;
}

.wbk-status-bar-icons {
  display: flex;
  align-items: center;
  gap: 6px;
}

.wbk-status-bar-icons svg {
  color: var(--wbk-text);
}

/* Page Content Area */
.wbk-page-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

/* Bottom Tab Bar */
.wbk-tab-bar {
  position: sticky;
  bottom: 0;
  z-index: 100;
  display: flex;
  align-items: flex-start;
  justify-content: space-around;
  height: 83px;
  padding-top: 8px;
  padding-bottom: 34px;
  background: var(--wbk-background);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--wbk-separator);
}

.wbk-tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-width: 64px;
  padding: 0;
  background: none;
  border: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  color: var(--wbk-text-tertiary);
  transition: color var(--wbk-duration-fast) var(--wbk-easing);
}

.wbk-tab:active {
  opacity: 0.6;
}

.wbk-tab.wbk-tab--active {
  color: var(--wbk-primary);
}

.wbk-tab-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 23px;
  height: 23px;
  position: relative;
}

.wbk-tab-icon i {
  width: 23px;
  height: 23px;
}

.wbk-tab-label {
  font: var(--wbk-text-tab-label);
  font-size: 11px;
  line-height: 1.3;
}

/* Unread Badge */
.wbk-tab-badge {
  position: absolute;
  top: -2px;
  right: -4px;
  width: 8px;
  height: 8px;
  border-radius: var(--wbk-radius-full);
  background: var(--wbk-error);
  border: 1.5px solid var(--wbk-background);
  pointer-events: none;
}
</style>

<div class="wbk-shell">

  <!-- iOS Status Bar -->
  <div class="wbk-status-bar" aria-hidden="true">
    <span class="wbk-status-bar-time">9:41</span>
    <div class="wbk-status-bar-icons">
      <!-- Signal Strength -->
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="9" width="3" height="3" rx="0.5" fill="currentColor" opacity="1"/>
        <rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="currentColor" opacity="1"/>
        <rect x="9" y="3" width="3" height="9" rx="0.5" fill="currentColor" opacity="1"/>
        <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="currentColor" opacity="1"/>
      </svg>
      <!-- WiFi -->
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 10.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3z" fill="currentColor"/>
        <path d="M4.93 8.47a4.37 4.37 0 016.14 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <path d="M2.1 5.64a8.13 8.13 0 0111.8 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </svg>
      <!-- Battery -->
      <svg width="27" height="13" viewBox="0 0 27 13" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="0.5" y="0.5" width="23" height="12" rx="2.5" stroke="currentColor" stroke-width="1" opacity="0.4"/>
        <rect x="25" y="4" width="1.5" height="5" rx="0.75" fill="currentColor" opacity="0.4"/>
        <rect x="2" y="2" width="20" height="9" rx="1.5" fill="currentColor"/>
      </svg>
    </div>
  </div>

  <!-- SLOT: pageContent — Leaf pages inject their main content here -->
  <div class="wbk-page-content">
    <!-- SLOT: pageContent -->
  </div>

  <!-- Bottom Tab Bar -->
  <nav class="wbk-tab-bar" role="tablist" aria-label="主导航">

    <!-- SLOT: activeTab — Leaf pages set which tab is active -->
    <!-- SLOT: activeTab -->

    <button class="wbk-tab wbk-tab--active" data-dom-id="tab-home" role="tab" aria-selected="true" aria-label="首页">
      <span class="wbk-tab-icon">
        <i data-lucide="house"></i>
      </span>
      <span class="wbk-tab-label">首页</span>
    </button>

    <button class="wbk-tab" data-dom-id="tab-inbox" role="tab" aria-selected="false" aria-label="收件箱">
      <span class="wbk-tab-icon">
        <i data-lucide="inbox"></i>
        <span class="wbk-tab-badge" aria-hidden="true"></span>
      </span>
      <span class="wbk-tab-label">收件箱</span>
    </button>

    <button class="wbk-tab" data-dom-id="tab-discover" role="tab" aria-selected="false" aria-label="发现">
      <span class="wbk-tab-icon">
        <i data-lucide="compass"></i>
      </span>
      <span class="wbk-tab-label">发现</span>
    </button>

    <button class="wbk-tab" data-dom-id="tab-settings" role="tab" aria-selected="false" aria-label="设置">
      <span class="wbk-tab-icon">
        <i data-lucide="settings"></i>
      </span>
      <span class="wbk-tab-label">设置</span>
    </button>

  </nav>

</div>

<!-- Lucide Icons CDN -->
<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
