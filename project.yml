name: WebBridgeKit
options:
  bundleIdPrefix: com.webbridgekit
  deploymentTarget:
    iOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  defaultConfig: Debug
  carthageBuildPath: Carthage/Build/iOS
  usePods: true
  generateEmptyDirectories: true
  objectVersion: 56

configs:
  Debug: debug
  Release: release
  Drel14Release: release

targets:
  WebBridgeKit:
    type: framework
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Sources
      - Resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "9"
        MARKETING_VERSION: "1.0"
        PRODUCT_NAME: WebBridgeKit
        PRODUCT_BUNDLE_IDENTIFIER: com.webbridgekit.superapp.webbridgekit
        SWIFT_VERSION: "5.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        DEFINES_MODULE: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        ENABLE_PREVIEWS: YES
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SDKROOT)/System/Library/Frameworks
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
      configs:
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DREL_CONTAINER_ONLY
        Drel14Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DREL_CONTAINER_ONLY
    dependencies:
      - target: Message
    buildPhases:
      - name: 'Copy Resources'
        files:
          - Resources/WebBridge.js
        runOnlyForDeploymentPostprocessing: false

  SuperApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    bundleId: com.webbridgekit.superapp
    sources:
      - path: SuperApp/Sources
        excludes:
          - "Info.plist"
      - SuperApp/Resources
    resources:
      - path: SuperApp/Resources
        excludes:
          - "**/*.strings"
          - "**/*.lproj/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.webbridgekit.superapp
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: SuperApp
        INFOPLIST_KEY_CFBundleDisplayName: Drel
        INFOPLIST_KEY_NSCameraUsageDescription: 用于扫描你部署的 Drel 自托管推送配置码。
        CURRENT_PROJECT_VERSION: "65"
        MARKETING_VERSION: "1.0.1"
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SDKROOT)/System/Library/Frameworks
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "B45VZCNYU3"
        CODE_SIGN_ENTITLEMENTS: SuperApp/SuperApp.entitlements
        GENERATE_INFOPLIST_FILE: YES
        # Merged with the generated content (Xcode 13+). The hand-maintained
        # Sources/Info.plist carries NSUserActivityTypes for the NSE icon
        # avatar donation, which the INFOPLIST_KEY_* generated settings
        # cannot express; generated keys fill in the rest.
        INFOPLIST_FILE: SuperApp/Sources/Info.plist
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_NSAppTransportSecurity: YES
        # Message attachments can be written only after an explicit "保存到相册"
        # action. Use the add-only purpose so Drel never requests read access.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 允许你主动将推送中的图片保存到系统相册
        # Release encryption uses only Apple system frameworks (CryptoKit / CommonCrypto).
        # No proprietary or third-party cryptographic implementation is shipped.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Bark declares remote-notification background mode; align with it.
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
      configs:
        Release:
          # The Store product is a container-only host. Keep this separate from
          # the reusable SDK's normal bridge-capable configurations.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DREL_CONTAINER_ONLY DREL_RELEASE_MINIMAL_SETTINGS
          # Automatic signing can select a development profile even for a
          # command-line archive. The Store candidate must use the installed
          # production profile and Apple Distribution identity instead.
          CODE_SIGN_STYLE: Manual
          # This profile was issued for the distribution certificate below.
          # Naming the certificate alone can select a newer, non-matching
          # Apple Distribution identity from the keychain.
          CODE_SIGN_IDENTITY: 4AFA8471A600DE35F54E34594597F01325FD50CE
          PROVISIONING_PROFILE_SPECIFIER: WebBridgeKit App Store
        Drel14Release:
          # Drel 1.4 exposes only the accepted private-app/offline management
          # UI while retaining the same container-only native capability wall.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DREL_CONTAINER_ONLY
          MARKETING_VERSION: "1.4.0"
          CURRENT_PROJECT_VERSION: "85"
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: 4AFA8471A600DE35F54E34594597F01325FD50CE
          PROVISIONING_PROFILE_SPECIFIER: WebBridgeKit App Store
    postBuildScripts:
      - name: Retain Required SDK Privacy Prompts for Store Build
        # The generated Info.plist can change without this phase receiving a
        # declared input. Run it on every Store build so an incremental
        # build cannot retain a removed, broader permission prompt.
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(DERIVED_FILE_DIR)/strip-bridge-privacy-prompts.stamp
        script: |
          if [ "${CONFIGURATION}" = "Release" ] || [ "${CONFIGURATION}" = "Drel14Release" ]; then
            PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
            if [ -f "${PLIST}" ]; then
              for KEY in \
                NSBluetoothAlwaysUsageDescription \
                NSFaceIDUsageDescription \
                NSLocationWhenInUseUsageDescription \
                NSMotionUsageDescription \
                NSPhotoLibraryUsageDescription; do
                /usr/libexec/PlistBuddy -c "Delete :${KEY}" "${PLIST}" 2>/dev/null || true
              done
              # Camera is declared solely for the explicit self-hosted push
              # configuration QR scanner. Other optional Bridge prompts above
              # remain unavailable in the Store product.
              /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity:NSAllowsArbitraryLoads" "${PLIST}" 2>/dev/null || true
            fi
          fi
          touch "${SCRIPT_OUTPUT_FILE_0}"
      - name: Strip Test Resources from Release
        outputFiles:
          - $(DERIVED_FILE_DIR)/strip-test-resources.stamp
        script: |
          if [ "${CONFIGURATION}" = "Release" ] || [ "${CONFIGURATION}" = "Drel14Release" ]; then
            echo "Stripping test/debug HTML resources from Release bundle..."
            cd "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app" || exit 0
            rm -f *test*.html bridge-*.html slow_resource*.html trigger_*.html \
                  manifest_*test*.html manifest_cache_demo.html manifest_demo.html \
                  permission-test.html execute_network_test.html ua_test.html static_test.html \
                  2>/dev/null || true
            find . -name "*test*.js" -not -name "WebBridge.js" -delete 2>/dev/null || true
            find . -name "*debug*.js" -delete 2>/dev/null || true
            find . -name "*test*.css" -delete 2>/dev/null || true
            find Frameworks -name "*debug*.js" -delete 2>/dev/null || true
            echo "Done. Test/debug resources stripped."
          else
            echo "Skipping test resource strip (Debug build)"
          fi
          mkdir -p "${DERIVED_FILE_DIR}"
          touch "${DERIVED_FILE_DIR}/strip-test-resources.stamp"

      - name: Embed Notification Service Extension
        outputFiles:
          - $(DERIVED_FILE_DIR)/embed-nse.stamp
        script: |
          NSE_NAME="NotificationServiceExtension.appex"
          NSE_PATH="$(find "${BUILT_PRODUCTS_DIR}" -name "${NSE_NAME}" -maxdepth 2 | head -1)"
          if [ -n "${NSE_PATH}" ] && [ -d "${NSE_PATH}" ]; then
            mkdir -p "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/PlugIns"
            cp -R "${NSE_PATH}" "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/PlugIns/"
            echo "Embedded ${NSE_NAME} into PlugIns"
          else
            echo "WARNING: ${NSE_NAME} not found in ${BUILT_PRODUCTS_DIR}"
          fi
          mkdir -p "${DERIVED_FILE_DIR}"
          touch "${DERIVED_FILE_DIR}/embed-nse.stamp"
    dependencies:
      - target: WebBridgeKit
        embed: true
      - target: Message
        embed: true
      - target: NotificationServiceExtension
        embed: true

  NotificationServiceExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    bundleId: com.webbridgekit.superapp.nse
    sources:
      - path: NotificationServiceExtension
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.webbridgekit.superapp.nse
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "65"
        MARKETING_VERSION: "1.0.1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "B45VZCNYU3"
        CODE_SIGN_ENTITLEMENTS: NotificationServiceExtension/NotificationServiceExtension.entitlements
        GENERATE_INFOPLIST_FILE: YES
        # The hand-maintained Info.plist carries the intent declarations
        # (NSUserActivityTypes + NSExtensionAttributes.IntentsSupported) that
        # the Bark-style icon avatar requires; the generated-plist machinery
        # cannot express the NSExtension attributes dict. Version/executable
        # keys inside still use $(...) build-setting substitution.
        INFOPLIST_FILE: NotificationServiceExtension/Info.plist
      configs:
        Release:
          DEVELOPMENT_TEAM: B45VZCNYU3
          PRODUCT_BUNDLE_IDENTIFIER: com.webbridgekit.superapp.nse
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: 4AFA8471A600DE35F54E34594597F01325FD50CE
          PROVISIONING_PROFILE_SPECIFIER: WebBridgeKit NSE App Store
        Drel14Release:
          MARKETING_VERSION: "1.4.0"
          CURRENT_PROJECT_VERSION: "85"
          DEVELOPMENT_TEAM: B45VZCNYU3
          PRODUCT_BUNDLE_IDENTIFIER: com.webbridgekit.superapp.nse
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: 4AFA8471A600DE35F54E34594597F01325FD50CE
          PROVISIONING_PROFILE_SPECIFIER: WebBridgeKit NSE App Store

